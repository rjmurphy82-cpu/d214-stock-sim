<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D214 Investing Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one app shell (header, ticker tape, routed page) on a dark navy ground; district red marks rank and action, green/red only for gains and losses. */
:root{
  --bg:#0f1720; --tape:#0b1219; --card:#141e29; --card-hi:#1a2531; --pop:#16212d;
  --line:#223041; --line-2:#2a3847; --line-3:#34455a; --rule:#3a1a24;
  --fg:#e6ebf1; --white:#ffffff; --muted:#aab4c3; --dim:#8a97a8; --soft:#c3cbd6;
  --red:#c8102e; --red-tint:#2a1720; --link:#ef5b70;
  --up:#45c08a; --down:#f0606f; --warn:#e0b45a; --warn-bg:#221d14; --warn-line:#4a3c1f; --cream:#e8d7b0;
  --bond:#6b8fbf; --cd:#c9a34e; --crypto:#e08a4f; --cashc:#4a5768;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--link);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:900}
.up{color:var(--up)}.down{color:var(--down)}
.label{font-size:13px;letter-spacing:.18em;font-weight:600;color:var(--muted);text-transform:uppercase}
.wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,4vw,56px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;font-size:30px;color:var(--white);white-space:nowrap}
.brand b{color:var(--red)}
.brand small{font-family:var(--body);font-size:13px;letter-spacing:.3em;font-weight:700;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{padding:14px 16px;color:var(--muted);font-weight:500;font-size:17px;white-space:nowrap;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--white);border-bottom-color:var(--red)}
nav a:hover{color:var(--white)}
.tape{background:var(--tape);border-bottom:1px solid var(--rule);overflow:hidden}
.tape .wrap{display:flex;gap:36px;height:46px;align-items:center;white-space:nowrap;overflow:hidden;font-family:var(--mono);font-size:14px}
.tape span.s{color:var(--muted)}
.tape .flash{animation:flash 1s ease-out}
@keyframes flash{from{background:rgba(255,255,255,.12)}to{background:transparent}}
.demo{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px;font-size:14px;color:var(--dim)}
.demo button{color:var(--link);font-weight:600}

/* page heads */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-block:36px 24px}
.h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(48px,7vw,84px);line-height:1;color:var(--white)}
.h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,4.5vw,52px);color:var(--white);text-wrap:balance}
section{padding-block:12px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{height:52px;padding:0 24px;border:1px solid var(--line-3);border-radius:999px;font-size:18px;font-weight:600;color:var(--soft)}
.pill[aria-selected="true"],.pill[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--white)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;background:var(--card);border:1px solid var(--line-2);border-radius:999px;font-size:15px;font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--red-tint);border-color:var(--red);color:var(--white)}
.chip img{width:30px;height:30px;object-fit:contain}
.filters{display:flex;flex-direction:column;gap:12px;padding-block:4px 24px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .label{width:76px;color:var(--dim)}
.logo{object-fit:contain;flex-shrink:0}
.badge{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background:var(--card-hi);border:1px solid var(--line-3);font-family:var(--display);font-weight:900;color:var(--white)}

/* standings */
.viewbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:16px}
.viewbar .t{font-family:var(--display);font-weight:700;font-size:28px;color:var(--white)}
.viewbar .c{color:var(--dim);font-size:15px}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.pod{display:flex;flex-direction:column;gap:12px;padding:24px 26px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:left;color:var(--fg)}
.pod:hover,.row:hover,.award:hover{background:var(--card-hi);border-color:#4a5d74}
.pod .rk{font-family:var(--display);font-weight:900;font-size:72px;line-height:.9;color:var(--red)}
.pod .nm{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;color:var(--white)}
.pod .sb{color:var(--dim);font-size:16px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rows{display:flex;flex-direction:column;padding-top:12px}
.row{display:grid;grid-template-columns:44px 48px minmax(0,1.6fr) minmax(80px,1fr) 120px 120px;gap:20px;align-items:center;min-height:72px;padding:0 20px;border:1px solid transparent;border-bottom-color:#1c2733;text-align:left;color:var(--fg)}
.row .rk{font-family:var(--display);font-weight:700;font-size:22px;color:var(--dim)}
.row .nm{font-family:var(--display);font-weight:700;font-size:22px;color:var(--white);white-space:nowrap}
.row .sb{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.me{background:var(--red-tint)}
.bar{height:10px;background:#1c2733;border-radius:5px;overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding-top:20px}
.award{display:flex;flex-direction:column;gap:10px;padding:22px 24px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:left;color:var(--fg)}
.award.lesson{border-top-color:var(--warn)}
.award .v{font-family:var(--mono);font-size:40px;font-weight:500}
.award .who{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;color:var(--white)}
.award .ls{padding-top:10px;border-top:1px solid var(--line-2);font-size:15px;color:var(--cream)}

/* portfolio */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:36px 24px}
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.who .n{font-family:var(--display);font-weight:700;font-size:28px;color:var(--white)}
.big{font-family:var(--mono);font-size:clamp(52px,8vw,88px);line-height:1;color:var(--white);font-variant-numeric:tabular-nums}
.gainline{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono);font-size:clamp(22px,3vw,30px)}
.gainline .vs{font-family:var(--body);font-size:18px;color:var(--muted)}
.cashbox{display:flex;flex-direction:column;align-items:center;padding:12px 22px;border:1px solid var(--line-2);border-radius:6px}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 30px;background:var(--red);border-radius:6px;font-size:19px;font-weight:600;color:var(--white)}
.cta:hover{background:#a90d27;color:var(--white)}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 24px;border:1px solid var(--line-3);border-radius:6px;font-size:17px;font-weight:600}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rankc{display:flex;align-items:center;gap:18px;padding:20px 24px;background:var(--card);border:1px solid var(--line);border-top:4px solid #6b7c91;border-radius:6px}
.rankc.top{border-top-color:var(--red)}
.rankc .r{font-family:var(--display);font-weight:900;font-size:50px;line-height:1;color:var(--white)}
.panels{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;padding-top:18px}
.panel{display:flex;flex-direction:column;gap:16px;padding:26px 30px;background:var(--card);border:1px solid var(--line);border-radius:6px;min-width:0}
.legend{display:flex;gap:18px;font-size:15px;color:var(--soft);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:8px}
.donutwrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{position:relative;width:180px;height:180px;border-radius:50%;flex-shrink:0}
.donut .hole{position:absolute;inset:34px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mix{display:flex;flex-direction:column;gap:9px;flex:1;min-width:180px}
.mix div{display:flex;align-items:center;gap:10px;font-size:16px}
.sw{width:13px;height:13px;border-radius:3px;flex-shrink:0}
.note{display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px 22px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;font-size:18px;color:var(--cream)}
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding-top:18px}
.hc{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:left;color:var(--fg)}
.hc:hover:not(:disabled){background:var(--card-hi);border-color:#4a5d74}
.hc:disabled{cursor:default}
.hc .sym{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--white)}
.tag{padding:2px 8px;border:1px solid currentColor;border-radius:3px;font-size:11px;letter-spacing:.12em;font-weight:600}
.closed{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding-top:18px}
.ct{padding:22px 26px 8px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--up);border-radius:6px}
.ct.loss{border-top-color:var(--down)}
.ctr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:14px;border-top:1px solid var(--line)}

/* checkup */
.grade{display:flex;flex-direction:column;align-items:center;justify-content:center;width:180px;height:180px;border:4px solid var(--red);border-radius:50%}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.gc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 22px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:center}
.gc.warn{border-top-color:var(--warn)}
.gc .g{font-family:var(--display);font-weight:900;font-size:88px;line-height:1}
.gc .what{font-size:16px;color:#d5dce5}
.gc .fix{font-size:16px;color:var(--cream)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding-top:20px}
.ck{display:flex;align-items:center;gap:18px;padding:20px 24px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.ck .t{flex:1;font-size:20px;color:var(--white)}

/* trade */
.tradebox{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-block:36px 64px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.types .pill{padding:0 8px;height:58px}
input[type=text]{width:100%;height:60px;padding:0 20px;background:var(--card);border:1px solid var(--line-2);border-radius:6px;font-family:var(--body);font-size:19px;color:var(--white)}
.quote{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 30px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;background:var(--card);border:2px solid var(--line-2);border-radius:6px}
.side button[aria-pressed="true"].buy{background:#1b3a2d;border-color:var(--up)}
.side button[aria-pressed="true"].short{background:#3a1a24;border-color:var(--link)}
.side .w{font-family:var(--display);font-weight:900;font-size:32px;color:var(--white)}
.side .d{font-size:15px;color:var(--soft)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;background:var(--card);border:1px solid var(--line-2);border-radius:6px;font-size:28px}
.stepper .v{min-width:100px;text-align:center;font-family:var(--mono);font-size:36px;color:var(--white)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.go{height:76px;width:100%;background:var(--red);border-radius:6px;font-family:var(--display);font-weight:900;font-size:28px;color:var(--white)}
.go:disabled{background:#3a4452;cursor:not-allowed}
.done{display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 32px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--up);border-radius:6px;text-align:center}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.terms button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px;background:var(--card);border:2px solid var(--line-2);border-radius:6px}
.terms button[aria-pressed="true"]{background:#2a2414;border-color:var(--cd)}
.bondnote{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--soft)}

/* drawer + sheet */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(5,9,14,.78);display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--pop);border-left:1px solid #3d5068;padding:28px clamp(18px,4vw,34px) 40px;display:flex;flex-direction:column;gap:20px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--card);border:1px solid var(--line-3);border-top:4px solid var(--red);border-radius:8px;padding:32px clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.x{align-self:flex-end;width:44px;height:44px;border:1px solid var(--line-3);border-radius:6px;font-size:22px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.kv span{display:block}
.kv .k{font-size:12px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.kv .v{font-family:var(--mono);font-size:20px;color:var(--white)}
.mini{display:flex;flex-direction:column}
.mini div{display:grid;grid-template-columns:14px minmax(0,1fr) 60px 90px 84px;gap:10px;align-items:center;min-height:34px;border-top:1px solid var(--line);font-family:var(--mono);font-size:14px}
.empty{color:var(--dim);font-size:15px}

@media (max-width:900px){
  .panels{grid-template-columns:1fr}
  .row{grid-template-columns:34px 40px minmax(0,1fr) 96px;gap:12px;padding:0 10px}
  .row .bar,.row .dol{display:none}
}
@media (max-width:520px){
  .types{grid-template-columns:repeat(2,minmax(0,1fr))}
  .terms{grid-template-columns:1fr}
  .row .sb{display:none}
  .brand{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.tape .flash{animation:none}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <span class="brand">D214 <b>·</b> <small>INVESTING</small></span>
    <nav aria-label="Main">
      <a href="#standings" data-route="standings">Standings</a>
      <a href="#portfolio" data-route="portfolio">My Portfolio</a>
      <a href="#checkup" data-route="checkup">Checkup</a>
      <a href="#trade" data-route="trade">Trade</a>
    </nav>
  </div>
</header>
<div class="tape" aria-label="Ticker"><div class="wrap" id="tape"></div></div>
<div class="wrap demo"><span id="demoMsg">Demo mode · sample prices move every 8 seconds · you are signed in as Jack M.</span><button type="button" data-act="reset">Reset demo</button></div>
<main id="app"></main>
<div id="overlay"></div>

<script>
(function(){
'use strict';
/* ---------- sample market ---------- */
const MARKET = {
  SPY:['S&P 500 ETF','index',528.40,516.52],
  NVDA:['NVIDIA','stock',875.22,857.22], AAPL:['Apple','stock',228.35,226.45], COST:['Costco','stock',893.10,889.99],
  JPM:['JPMorgan Chase','stock',198.73,196.90], XOM:['Exxon Mobil','stock',114.33,116.60], AMZN:['Amazon','stock',182.60,184.10],
  TSLA:['Tesla','stock',251.30,255.44], MSFT:['Microsoft','stock',418.20,415.10], GOOGL:['Alphabet','stock',162.45,160.90],
  META:['Meta Platforms','stock',502.18,497.30], V:['Visa','stock',272.55,271.10],
  BND:['Total Bond Market ETF','bond',73.20,73.11], AGG:['Core U.S. Aggregate Bond ETF','bond',98.40,98.30],
  TLT:['20+ Year Treasury Bond ETF','bond',94.10,94.43], SHY:['1-3 Year Treasury Bond ETF','bond',82.15,82.13],
  GBTC:['Grayscale Bitcoin Trust','crypto',54.80,53.15], ETHE:['Grayscale Ethereum Trust','crypto',24.60,24.90]
};
const SPY_START = 516.52; // S&P level on the competition's first day
const prices = {}; Object.keys(MARKET).forEach(s => prices[s] = MARKET[s][2]);
const prev = {}; Object.keys(MARKET).forEach(s => prev[s] = MARKET[s][3]);
const TAPE = ['SPY','AAPL','NVDA','AMZN','GOOGL','JPM','BND','GBTC','V','META','XOM','TLT'];
const WHY = {NVDA:'Data center demand keeps growing.',AAPL:'New iPhone comes out in September.',COST:'People buy groceries in any economy.',JPM:'Biggest bank, pays a dividend.',XOM:'Oil prices were rising.',BND:'Something safer to balance my stocks.',GBTC:'Wanted a little crypto exposure.',AMZN:'Online sales will slow after the holidays.'};

const START = () => ({
  cash: 11466.34,
  pos: [
    {sym:'NVDA',side:'long',n:30,b:812.40},{sym:'AAPL',side:'long',n:60,b:214.10},{sym:'COST',side:'long',n:12,b:842.00},
    {sym:'JPM',side:'long',n:50,b:191.20},{sym:'XOM',side:'long',n:70,b:121.80},{sym:'BND',side:'long',n:100,b:72.60},
    {sym:'GBTC',side:'long',n:120,b:50.10},{sym:'AMZN',side:'short',n:30,b:188.40}
  ],
  cds: [{id:1,amt:5000,rate:4.20,term:6,accrued:17.26,matures:'Mar 1'}],
  closed: [
    {sym:'AMD',n:40,b:157.00,s:172.40,d:'11 days'},{sym:'TSLA',n:25,b:242.13,s:262.10,d:'16 days'},{sym:'GOOGL',n:18,b:150.65,s:162.45,d:'9 days'},
    {sym:'PLTR',n:50,b:38.40,s:32.04,d:'6 days'},{sym:'SHOP',n:30,b:79.85,s:72.82,d:'14 days'}
  ],
  tradesWeek: 2
});
let P = load() || START();
function load(){ try{ const t = localStorage.getItem('d214sim'); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem('d214sim', JSON.stringify(P)); }catch(e){} }

/* ---------- logos (filled in after publish) ---------- */
const LOGOS = {'Hersey':'logos/hersey.png','Prospect':'logos/prospect.png','Buffalo Grove':'logos/buffalo-grove.png','Rolling Meadows':'logos/rolling-meadows.png','Elk Grove':'logos/elk-grove.png','Wheeling':'logos/wheeling.png'};
function logo(school, size){
  const src = LOGOS[school];
  const ini = school.split(' ').map(w=>w[0]).join('');
  if (src) return `<img class="logo" src="${src}" alt="${school} logo" width="${size}" height="${size}" style="width:${size}px;height:${size}px" onerror="this.outerHTML='<span class=&quot;badge&quot; style=&quot;width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px&quot;>${ini}</span>'">`;
  return `<span class="badge" aria-label="${school}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px">${ini}</span>`;
}

/* ---------- portfolio math ---------- */
const posValue = p => p.side==='long' ? p.n*prices[p.sym] : p.n*(2*p.b - prices[p.sym]);
const posGain  = p => p.side==='long' ? (prices[p.sym]-p.b)*p.n : (p.b-prices[p.sym])*p.n;
const cdValue = c => c.amt + c.accrued;
function totals(){
  const inv = P.pos.reduce((a,p)=>a+posValue(p),0) + P.cds.reduce((a,c)=>a+cdValue(c),0);
  const total = P.cash + inv;
  const ret = (total/100000 - 1)*100;
  const spy = (prices.SPY/SPY_START - 1)*100;
  return {total, ret, spy, vs: ret - spy};
}
function mixOf(){
  const t = totals().total, m = {Stocks:0,Bonds:0,CD:0,Crypto:0,Shorts:0,Cash:P.cash};
  P.pos.forEach(p => { const v=posValue(p), ty=MARKET[p.sym][1]; if(p.side==='short') m.Shorts+=v; else if(ty==='bond') m.Bonds+=v; else if(ty==='crypto') m.Crypto+=v; else m.Stocks+=v; });
  P.cds.forEach(c => m.CD += cdValue(c));
  const colors = {Stocks:'#ef5b70',Bonds:'#6b8fbf',CD:'#c9a34e',Crypto:'#e08a4f',Shorts:'#e0b45a',Cash:'#4a5768'};
  return Object.keys(m).filter(k=>m[k]>0.5).map(k=>({name:k,v:m[k],pct:m[k]/t*100,color:colors[k]}));
}

function checkup(){
  const t = totals();
  const longs = P.pos.filter(p=>p.side==='long');
  const big = longs.map(p=>({sym:p.sym,w:posValue(p)/t.total*100})).sort((a,b)=>b.w-a.w)[0] || {sym:'none',w:0};
  const cashPct = P.cash/t.total*100;
  const losers = P.pos.filter(p=>posGain(p)<0);
  const sectorish = new Set(longs.map(p=>MARKET[p.sym][1]==='stock'?p.sym:MARKET[p.sym][1])).size;
  const vsG = t.vs>=1?'A':t.vs>=0?'B':t.vs>=-2?'C':'D';
  const spG = big.w<=15?'A':big.w<=20?'B':big.w<=30?'C':'D';
  const caG = cashPct<5?'A':cashPct<10?'B':cashPct<20?'C':'D';
  const loG = losers.length===0?'A':losers.length===1?'B':losers.length===2?'C':'D';
  const pts = {A:4,B:3,C:2,D:1}; const avg = (pts[vsG]+pts[spG]+pts[caG]+pts[loG])/4;
  const overall = avg>=3.75?'A':avg>=3.4?'A−':avg>=3.1?'B+':avg>=2.75?'B':avg>=2.4?'B−':avg>=2.1?'C+':avg>=1.75?'C':'D';
  return { overall, grades:[
    {l:'Vs. market',g:vsG,stat:(t.vs>=0?'+':'−')+Math.abs(t.vs).toFixed(2)+' pts',what:t.vs>=0?'You’re beating the S&P 500.':'The S&P 500 is ahead of you.',fix:t.vs>=0?'Keep it up. Check again next week.':'Compare your picks to the market. What’s dragging?'},
    {l:'Spread out',g:spG,stat:Math.round(big.w)+'% in '+big.sym,what:big.w>20?'One stock holds a big share of your money.':'No single stock dominates your portfolio.',fix:big.w>20?'Get your biggest stock under 20%.':'Nice balance. Keep each position under 20%.'},
    {l:'Cash',g:caG,stat:Math.round(cashPct)+'% idle',what:'Uninvested cash doesn’t grow.',fix:cashPct>=10?'Put some to work, keep under 10%.':'Good. A little cash lets you buy dips.'},
    {l:'Losers',g:loG,stat:losers.length+' of '+P.pos.length+' down',what:losers.length?(losers.map(p=>p.sym).join(', ')+' '+(losers.length>1?'are':'is')+' losing money.'):'Every position is in the green.',fix:losers.length?'Decide: hold, or cut the loss?':'Set a plan for when to take profits.'}
  ], checks:[
    ['Own 5 or more investments', P.pos.length+P.cds.length, P.pos.length+P.cds.length>=5],
    ['3 or more kinds of investments', sectorish>=3?sectorish:sectorish, sectorish>=3],
    ['Beating the S&P 500', (t.vs>=0?'+':'−')+Math.abs(t.vs).toFixed(2), t.vs>=0],
    ['No stock over 20%', Math.round(big.w)+'%', big.w<=20],
    ['Cash under 10%', Math.round(cashPct)+'%', cashPct<10],
    ['Traded this week', P.tradesWeek, P.tradesWeek>0]
  ]};
}

    html = `<div><h2 class="h2" style="font-size:40px">Cash out CD early</h2><p style="margin:6px 0 0;color:var(--muted);font-size:18px">${c.term}-month CD at ${c.rate.toFixed(2)}% · matures ${c.matures}</p></div>
      <div style="display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid var(--line)">
        <div class="line"><span style="color:var(--muted);font-size:18px">Worth now</span><span class="num" style="font-size:28px;color:var(--white)">${money(cdValue(c))}</span></div>
        <div class="line"><span style="color:var(--muted);font-size:18px">Early penalty</span><span class="num down" style="font-size:28px">−${money(penalty)}</span></div>
        <div class="line"><span style="color:var(--muted);font-size:18px">You get</span><span class="num" style="font-size:28px;color:var(--white)">${money(get)}</span></div></div>
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px"><button type="button" class="ghost" data-act="close">Cancel</button><button type="button" class="go" style="height:64px;font-size:24px" data-act="cdcash">Cash out</button></div>`;
  } else {
    const [,sym,side] = sh.key.split(':'); const p = P.pos.find(x=>x.sym===sym&&x.side===side); if(!p){ UI.sheet=null; return ''; }
    const isShort = side==='short', n = Math.min(sh.n, p.n), price = prices[sym];
    const g = isShort ? (p.b-price)*n : (price-p.b)*n;
    html = `<div><h2 class="h2" style="font-size:40px">${isShort?'Close '+sym+' short':'Sell '+sym}</h2><p style="margin:6px 0 0;color:var(--muted);font-size:18px">${MARKET[sym][0]}</p></div>
      <div class="kv"><span><span class="k">${isShort?'Shorted at':'Bought at'}</span><span class="v">${money(p.b)}</span></span><span><span class="k">Now</span><span class="v">${money(price)}</span></span>
        <span><span class="k">Shares</span><span class="v">${p.n}</span></span><span><span class="k">Gain so far</span><span class="v ${cls(posGain(p))}">${signed2(posGain(p))}</span></span></div>
      ${WHY[sym]?`<p class="disp" style="margin:0;font-weight:700;font-style:italic;font-size:17px;color:var(--fg)">“${WHY[sym]}” <span style="font-family:var(--body);font-style:normal;font-weight:400;font-size:14px;color:var(--dim)">your reason when you bought</span></p>`:''}
      <div class="line"><span class="label">Shares</span><div class="stepper"><button type="button" data-act="sn:-" aria-label="Fewer shares">−</button><span class="v" style="min-width:80px">${n}</span><button type="button" data-act="sn:+" aria-label="More shares">+</button><button type="button" data-act="sn:all" style="width:auto;padding:0 16px;font-size:16px;font-weight:600">All</button></div></div>
      <div style="display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid var(--line)">
        <div class="line"><span style="color:var(--muted);font-size:18px">${isShort?'It costs to buy back':'You get'}</span><span class="num" style="font-size:28px;color:var(--white)">${money(price*n)}</span></div>
        <div class="line"><span style="color:var(--muted);font-size:18px">Profit</span><span class="num ${cls(g)}" style="font-size:28px">${signed2(g)}</span></div></div>
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px"><button type="button" class="ghost" data-act="close">Cancel</button><button type="button" class="go" style="height:64px;font-size:24px" data-act="sell">${isShort?'Close':'Sell'} ${n} ${n===1?'share':'shares'}</button></div>`;
  }
  return `<div class="scrim center" data-act="close"><div class="sheet" role="dialog" aria-modal="true" data-stop>${html}</div></div>`;
}

/* ---------- actions ---------- */
function act(a, el){
  const [k, ...rest] = a.split(':'); const v = rest.join(':'); const tr = UI.trade;
  switch(k){
    case 'tab': UI.tab=v; break;
    case 'school': UI.school=v||null; UI.sec=null; break;
    case 'sec': UI.sec = v===''?null:+v; break;
    case 'open': UI.drawer=v; break;
    case 'close': UI.drawer=null; UI.sheet=null; break;
    case 'sheet': { const pos = v.startsWith('pos:') ? P.pos.find(x=>'pos:'+x.sym+':'+x.side===v) : null; UI.sheet={key:v,n:pos?pos.n:0}; break; }
    case 'sn': { const p = P.pos.find(x=>'pos:'+x.sym+':'+x.side===UI.sheet.key); UI.sheet.n = v==='all'?p.n : Math.max(1,Math.min(p.n, UI.sheet.n+(v==='+'?1:-1))); break; }
    case 'sell': {
      const [,sym,side] = UI.sheet.key.split(':'); const p = P.pos.find(x=>x.sym===sym&&x.side===side); const n = Math.min(UI.sheet.n,p.n), price = prices[sym];
      let g;
      if (side==='long'){ P.cash += n*price; g=(price-p.b)*n; P.closed.push({sym,n,b:p.b,s:price,d:'just now'}); }
      else { P.cash += n*(2*p.b-price); g=(p.b-price)*n; P.closed.push({sym:sym+' (short)',n,b:price,s:price+(p.b-price),d:'just now'}); }
      p.n -= n; if (p.n<=0) P.pos = P.pos.filter(x=>x!==p);
      P.tradesWeek++; save();
      UI.sheet.done = {title:(side==='short'?'Closed ':'Sold ')+n+' '+sym, p:g}; break;
    }
    case 'cdcash': { const c = P.cds.find(x=>'cd:'+x.id===UI.sheet.key); const pen=c.amt*c.rate/100*3/12; P.cash += cdValue(c)-pen; P.cds = P.cds.filter(x=>x!==c); P.tradesWeek++; save(); UI.sheet.done={title:'CD cashed out',p:c.accrued-pen}; break; }
    case 'type': tr.type=v; tr.done=null; tr.side='buy'; tr.n=10; tr.q=''; break;
    case 'pick': tr.pick[tr.type]=v; break;
    case 'side': tr.side=v; break;
    case 'n': tr.n = Math.max(1, tr.n+(v==='+'?1:-1)); break;
    case 'term': tr.term=+v; break;
    case 'cd': tr.cd = Math.max(1000,Math.min(25000, tr.cd+(v==='+'?1000:-1000))); break;
    case 'newtrade': tr.done=null; tr.n=10; break;
    case 'submit': {
      const sym = tr.pick[tr.type], price = prices[sym], n = tr.n, cost = price*n; if (cost>P.cash) return;
      const side = (tr.type==='bond'||tr.side==='buy') ? 'long' : 'short';
      P.cash -= cost;
      const ex = P.pos.find(x=>x.sym===sym&&x.side===side);
      if (ex){ ex.b = (ex.b*ex.n + price*n)/(ex.n+n); ex.n += n; } else P.pos.push({sym,side,n,b:price});
      P.tradesWeek++; save();
      tr.done = {title:(side==='long'?'Bought ':'Shorted ')+n+' '+sym, sub:'at '+money(price)+' · '+money(cost)}; break;
    }
    case 'cdopen': {
      if (tr.cd>P.cash) return;
      const dates={3:'Jan 9',6:'Apr 9',12:'Oct 9, 2027'}, rates={3:4.00,6:4.20,12:4.40};
      P.cash -= tr.cd; P.cds.push({id:Date.now(),amt:tr.cd,rate:rates[tr.term],term:tr.term,accrued:0,matures:dates[tr.term]}); P.tradesWeek++; save();
      tr.done = {title:'Opened '+whole(tr.cd)+' CD', sub:tr.term+' months at '+rates[tr.term].toFixed(2)+'%'}; break;
    }
    case 'reset': P = START(); save(); UI.sheet=null; UI.drawer=null; UI.trade.done=null; break;
  }
  render();
}

/* ---------- render ---------- */
function renderTape(changed){
  document.getElementById('tape').innerHTML = TAPE.map(s=>{ const c=(prices[s]/prev[s]-1)*100;
    return `<span class="${changed?'flash':''}" style="display:flex;gap:9px"><span class="s">${s}</span><span class="${cls(c)}">${c>=0?'▲':'▼'} ${prices[s].toFixed(2)}</span></span>`; }).join('');
}
function render(){
  const r = route();
  document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current', a.dataset.route===r?'page':'false'));
  const app = document.getElementById('app');
  app.innerHTML = r==='standings'?vStandings() : r==='portfolio'?vPortfolio() : r==='checkup'?vCheckup() : vTrade();
  document.getElementById('overlay').innerHTML = vDrawer() + vSheet();
  renderTape(false);
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  if (el.tagName==='A' && el.getAttribute('href')){ UI.drawer=null; UI.sheet=null; return; }
  e.preventDefault(); act(el.dataset.act, el);
});
document.addEventListener('input', e=>{ if (e.target.id==='search'){ UI.trade.q = e.target.value; document.getElementById('chips').innerHTML = chipsHtml(); } });
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && (UI.drawer||UI.sheet)){ UI.drawer=null; UI.sheet=null; render(); } });
window.addEventListener('hashchange', ()=>{ UI.drawer=null; UI.sheet=null; render(); window.scrollTo(0,0); });

/* sample price movement: stands in for the 15-minute refresh from the market data feed */
setInterval(()=>{
  if (UI.sheet || UI.drawer || document.activeElement && document.activeElement.id==='search') { Object.keys(prices).forEach(s=>{ prices[s] = Math.max(1, prices[s]*(1+(Math.random()-0.48)*0.004)); }); renderTape(true); return; }
  Object.keys(prices).forEach(s=>{ prices[s] = Math.max(1, prices[s]*(1+(Math.random()-0.48)*0.004)); });
  const y = window.scrollY; render(); window.scrollTo(0,y); renderTape(true);
}, 8000);

render();
})();
</script>
