<!doctype html><html><head><meta charset=utf8><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0f1720"><title>D214 Investing Competition</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one app shell (header, ticker tape, routed page) on a dark navy ground; district red marks rank and action, green/red only for gains and losses. */
:root{
  --bg:#0f1720; --tape:#0b1219; --card:#141e29; --card-hi:#1a2531; --pop:#16212d;
  --line:#223041; --line-2:#2a3847; --line-3:#34455a; --rule:#3a1a24;
  --fg:#e6ebf1; --white:#ffffff; --muted:#aab4c3; --dim:#8a97a8; --soft:#c3cbd6;
  --red:#c8102e; --red-tint:#2a1720; --link:#ef5b70;
  --up:#45c08a; --down:#f0606f; --warn:#e0b45a; --warn-bg:#221d14; --warn-line:#4a3c1f; --cream:#e8d7b0;
  --bond:#6b8fbf; --cd:#c9a34e; --crypto:#e08a4f; --cashc:#4a5768;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--link);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:900}
.up{color:var(--up)}.down{color:var(--down)}
.label{font-size:13px;letter-spacing:.18em;font-weight:600;color:var(--muted);text-transform:uppercase}
.wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,4vw,56px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;font-size:30px;color:var(--white);white-space:nowrap}
.brand b{color:var(--red)}
.brand small{font-family:var(--body);font-size:13px;letter-spacing:.3em;font-weight:700;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{padding:14px 16px;color:var(--muted);font-weight:500;font-size:17px;white-space:nowrap;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--white);border-bottom-color:var(--red)}
nav a:hover{color:var(--white)}
.tape{background:var(--tape);border-bottom:1px solid var(--rule);overflow:hidden}
.tape .wrap{display:flex;gap:36px;height:46px;align-items:center;white-space:nowrap;overflow:hidden;font-family:var(--mono);font-size:14px}
.tape span.s{color:var(--muted)}
.tape .flash{animation:flash 1s ease-out}
@keyframes flash{from{background:rgba(255,255,255,.12)}to{background:transparent}}
.demo{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px;font-size:14px;color:var(--dim)}
.demo button{color:var(--link);font-weight:600}

/* market data attribution: stays on screen on every page (required by the Massive order form) */
.attr{position:sticky;bottom:0;z-index:30;background:rgba(11,18,25,.97);border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom,0px)}
.attr .wrap{display:flex;justify-content:space-between;align-items:center;gap:6px 20px;flex-wrap:wrap;padding-block:10px;font-size:14px;color:var(--dim)}
.attr .src{color:var(--soft)}
.attr .src a{color:var(--white);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.attr .mk{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px}
.attr .mk i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:block}
.attr .mk.open i{background:var(--up)}
.attr .mk.stale{color:var(--warn)}
.tico{width:24px;height:24px;border-radius:6px;object-fit:contain;background:#fff;padding:2px;flex:none;display:inline-block;vertical-align:middle}

/* page heads */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-block:36px 24px}
.h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(48px,7vw,84px);line-height:1;color:var(--white)}
.h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,4.5vw,52px);color:var(--white);text-wrap:balance}
section{padding-block:12px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{height:52px;padding:0 24px;border:1px solid var(--line-3);border-radius:999px;font-size:18px;font-weight:600;color:var(--soft)}
.pill[aria-selected="true"],.pill[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--white)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;background:var(--card);border:1px solid var(--line-2);border-radius:999px;font-size:15px;font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--red-tint);border-color:var(--red);color:var(--white)}
.chip img{width:30px;height:30px;object-fit:contain}
.filters{display:flex;flex-direction:column;gap:12px;padding-block:4px 24px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .label{width:76px;color:var(--dim)}
.logo{object-fit:contain;flex-shrink:0}
.badge{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background:var(--card-hi);border:1px solid var(--line-3);font-family:var(--display);font-weight:900;color:var(--white)}

/* standings */
.viewbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:16px}
.viewbar .t{font-family:var(--display);font-weight:700;font-size:28px;color:var(--white)}
.viewbar .c{color:var(--dim);font-size:15px}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.pod{display:flex;flex-direction:column;gap:12px;padding:24px 26px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:left;color:var(--fg)}
.pod:hover,.row:hover,.award:hover{background:var(--card-hi);border-color:#4a5d74}
.pod .rk{font-family:var(--display);font-weight:900;font-size:72px;line-height:.9;color:var(--red)}
.pod .nm{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;color:var(--white)}
.pod .sb{color:var(--dim);font-size:16px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rows{display:flex;flex-direction:column;padding-top:12px}
.row{display:grid;grid-template-columns:44px 48px minmax(0,1.6fr) minmax(80px,1fr) 120px 120px;gap:20px;align-items:center;min-height:72px;padding:0 20px;border:1px solid transparent;border-bottom-color:#1c2733;text-align:left;color:var(--fg)}
.row .rk{font-family:var(--display);font-weight:700;font-size:22px;color:var(--dim)}
.row .nm{font-family:var(--display);font-weight:700;font-size:22px;color:var(--white);white-space:nowrap}
.row .sb{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.me{background:var(--red-tint)}
.bar{height:10px;background:#1c2733;border-radius:5px;overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding-top:20px}
.award{display:flex;flex-direction:column;gap:10px;padding:22px 24px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:left;color:var(--fg)}
.award.lesson{border-top-color:var(--warn)}
.award .v{font-family:var(--mono);font-size:40px;font-weight:500}
.award .who{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2;color:var(--white)}
.award .aw-sub{font-family:var(--body);font-weight:500;font-size:14px;color:var(--dim)}
.awscope{display:flex;align-items:center;gap:12px}.awscope>span{display:flex;flex-direction:column;gap:2px}.awscope .t{font-family:var(--display);font-weight:700;font-size:22px;color:var(--white)}
.award .ls{padding-top:10px;border-top:1px solid var(--line-2);font-size:15px;color:var(--cream)}
.award.tiers{gap:0;padding-bottom:8px}
.aw-tier{display:flex;flex-direction:column;gap:8px;width:100%;padding:16px 0;border-top:1px solid var(--line-2);text-align:left;color:var(--fg)}
.award .label+.aw-tier{margin-top:14px}
.aw-tier:hover .aw-nm{text-decoration:underline;text-decoration-color:var(--line-3);text-underline-offset:4px}
.aw-scope{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.aw-main{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.aw-main .v{font-size:26px;min-width:108px}
.aw-main .who{font-size:18px;gap:10px}
.aw-main .aw-sub{font-size:13px}
.aw-ls{font-size:14px;line-height:1.4;color:var(--cream)}
.aw-none{font-size:15px;color:var(--dim)}

/* portfolio */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:36px 24px}
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.who .n{font-family:var(--display);font-weight:700;font-size:28px;color:var(--white)}
.big{font-family:var(--mono);font-size:clamp(52px,8vw,88px);line-height:1;color:var(--white);font-variant-numeric:tabular-nums}
.gainline{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono);font-size:clamp(22px,3vw,30px)}
.gainline .vs{font-family:var(--body);font-size:18px;color:var(--muted)}
.cashbox{display:flex;flex-direction:column;align-items:center;padding:12px 22px;border:1px solid var(--line-2);border-radius:6px}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 30px;background:var(--red);border-radius:6px;font-size:19px;font-weight:600;color:var(--white)}
.cta:hover{background:#a90d27;color:var(--white)}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 24px;border:1px solid var(--line-3);border-radius:6px;font-size:17px;font-weight:600}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rankc{display:flex;align-items:center;gap:18px;padding:20px 24px;background:var(--card);border:1px solid var(--line);border-top:4px solid #6b7c91;border-radius:6px}
.rankc.top{border-top-color:var(--red)}
.rankc .r{font-family:var(--display);font-weight:900;font-size:50px;line-height:1;color:var(--white)}
.panels{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;padding-top:18px}
.panel{display:flex;flex-direction:column;gap:16px;padding:26px 30px;background:var(--card);border:1px solid var(--line);border-radius:6px;min-width:0}
.legend{display:flex;gap:18px;font-size:15px;color:var(--soft);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:8px}
.donutwrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{position:relative;width:180px;height:180px;border-radius:50%;flex-shrink:0}
.donut .hole{position:absolute;inset:34px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mix{display:flex;flex-direction:column;gap:9px;flex:1;min-width:180px}
.mix div{display:flex;align-items:center;gap:10px;font-size:16px}
.dnut{position:relative;flex-shrink:0}
.dnut svg{display:block;width:100%;height:100%;overflow:visible}
.dnut path{cursor:pointer;transition:transform .18s ease,opacity .18s ease;transform-box:view-box;transform-origin:center}
.dnut.hot path{opacity:.35}
.dnut path.on{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1.035)}
.dhole{position:absolute;inset:28%;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dhole>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;position:absolute;inset:0;transition:opacity .15s}
.dh-hov{opacity:0}
.dnut.hot .dh-def{opacity:0}
.dnut.hot .dh-hov{opacity:1}
.dh-n{flex-shrink:0;font-size:15px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mix div[data-dk],.mini div[data-dk]{cursor:default;transition:background .15s,box-shadow .15s}
.mix div.on,.mini div.on{background:var(--card-hi);box-shadow:inset 3px 0 0 var(--hl,#ef5b70)}
.mix div.on{margin-inline:-8px;padding-inline:8px}
@media (prefers-reduced-motion:reduce){.dnut path,.dhole>div,.mix div,.mini div{transition:none}}
.sw{width:13px;height:13px;border-radius:3px;flex-shrink:0}
.note{display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px 22px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;font-size:18px;color:var(--cream)}
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding-top:18px}
.hc{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:left;color:var(--fg)}
.hc:hover:not(:disabled){background:var(--card-hi);border-color:#4a5d74}
.hc:disabled{cursor:default}
.hc .sym{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--white)}
.tag{padding:2px 8px;border:1px solid currentColor;border-radius:3px;font-size:11px;letter-spacing:.12em;font-weight:600}
.closed{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding-top:18px}
.ct{padding:22px 26px 8px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--up);border-radius:6px}
.ct.loss{border-top-color:var(--down)}
.ctr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:14px;border-top:1px solid var(--line)}

/* checkup */
.grade{display:flex;flex-direction:column;align-items:center;justify-content:center;width:180px;height:180px;border:4px solid var(--red);border-radius:50%}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.gc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 22px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;text-align:center}
.gc.warn{border-top-color:var(--warn)}
.gc .g{font-family:var(--display);font-weight:900;font-size:88px;line-height:1}
.gc .what{font-size:16px;color:#d5dce5}
.gc .fix{font-size:16px;color:var(--cream)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding-top:20px}
.ck{display:flex;align-items:center;gap:18px;padding:20px 24px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.ck .t{flex:1;font-size:20px;color:var(--white)}

/* trade */
.tradebox{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-block:36px 64px}
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.types .pill{padding:0 8px;height:58px}
input[type=text]{width:100%;height:60px;padding:0 20px;background:var(--card);border:1px solid var(--line-2);border-radius:6px;font-family:var(--body);font-size:19px;color:var(--white)}
.quote{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 30px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;background:var(--card);border:2px solid var(--line-2);border-radius:6px}
.side button[aria-pressed="true"].buy{background:#1b3a2d;border-color:var(--up)}
.side button[aria-pressed="true"].short{background:#3a1a24;border-color:var(--link)}
.side .w{font-family:var(--display);font-weight:900;font-size:32px;color:var(--white)}
.side .d{font-size:15px;color:var(--soft)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;background:var(--card);border:1px solid var(--line-2);border-radius:6px;font-size:28px}
.stepper .v{min-width:100px;text-align:center;font-family:var(--mono);font-size:36px;color:var(--white)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.go{height:76px;width:100%;background:var(--red);border-radius:6px;font-family:var(--display);font-weight:900;font-size:28px;color:var(--white)}
.go:disabled{background:#3a4452;cursor:not-allowed}
.done{display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 32px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--up);border-radius:6px;text-align:center}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.terms button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px;background:var(--card);border:2px solid var(--line-2);border-radius:6px}
.terms button[aria-pressed="true"]{background:#2a2414;border-color:var(--cd)}
.bondnote{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--soft)}

/* drawer + sheet */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(5,9,14,.78);display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--pop);border-left:1px solid #3d5068;padding:28px clamp(18px,4vw,34px) 40px;display:flex;flex-direction:column;gap:20px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--card);border:1px solid var(--line-3);border-top:4px solid var(--red);border-radius:8px;padding:32px clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.x{align-self:flex-end;width:44px;height:44px;border:1px solid var(--line-3);border-radius:6px;font-size:22px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.kv span{display:block}
.kv .k{font-size:12px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.kv .v{font-family:var(--mono);font-size:20px;color:var(--white)}
.roster{display:flex;flex-direction:column}
.roster button{display:grid;grid-template-columns:30px minmax(0,1fr) 92px 78px;gap:10px;align-items:center;min-height:46px;padding:0 8px;border-top:1px solid var(--line);text-align:left;color:var(--fg);width:100%}
.roster button:hover,.roster button:focus-visible{background:var(--card-hi)}
.roster button.me{background:var(--card-hi);box-shadow:inset 3px 0 0 var(--red)}
.roster .rk{font-family:var(--mono);font-size:14px;color:var(--dim)}
.roster .nm{display:flex;flex-direction:column;gap:5px;min-width:0}
.roster .nm>span:first-child{color:var(--white);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.roster .bar i{display:block;height:100%;border-radius:2px}
.roster .r{text-align:right;font-family:var(--mono);font-size:14px}
.backlink{align-self:flex-start;color:var(--link);font-weight:600;font-size:15px;padding:4px 0}
.mini{display:flex;flex-direction:column}
.mini div{display:grid;grid-template-columns:14px minmax(0,1fr) 60px 90px 84px;gap:10px;align-items:center;min-height:34px;border-top:1px solid var(--line);font-family:var(--mono);font-size:14px}
.empty{color:var(--dim);font-size:15px}

/* ---------- format ---------- */
const money = x => '$' + Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* money market: earns interest every day (compounded daily), money moves in or out anytime */

const todayStr = () => { const n = new Date(Date.now() + ((P && P.demoOffset)||0)*DAY); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())).toISOString().slice(0,10); };

const daysBetween = (a,b) => Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/DAY);

/* Interactive donut: hovering (or tapping) a slice pops it out, shows what it is in the hole,
   and highlights the matching row in the list next to it (rows carry the same data-dk / data-di). */
function donutSvg(key, parts, o){
  const R = 88, r = 55, C = 100, tot = parts.reduce((s,p)=>s+Math.max(0,p.pct),0) || 1;
  const pt = (rad, a) => (C + rad*Math.sin(a)).toFixed(2) + ' ' + (C - rad*Math.cos(a)).toFixed(2);
  let a0 = 0;
  const slices = parts.map((p,i)=>{
    const sweep = Math.max(0,p.pct)/tot*Math.PI*2, s = a0, e = a0 + sweep; a0 = e;
    if (sweep <= 0) return '';
    const gap = parts.length > 1 ? Math.min(0.012, sweep/4) : 0;
    const s1 = s + gap, e1 = Math.min(e - gap, s + Math.PI*2 - 0.0001), big = (e1 - s1) > Math.PI ? 1 : 0, mid = (s + e)/2;
    const d = `M${pt(R,s1)} A${R} ${R} 0 ${big} 1 ${pt(R,e1)} L${pt(r,e1)} A${r} ${r} 0 ${big} 0 ${pt(r,s1)}Z`;
    return `<path d="${d}" fill="${p.color}" data-dk="${key}" data-di="${i}" style="--dx:${(Math.sin(mid)*7).toFixed(2)}px;--dy:${(-Math.cos(mid)*7).toFixed(2)}px"
      data-dn="${esc(p.label)}" data-dt="${esc(p.sub||'')}" data-dp="${p.pct.toFixed(1)}%" data-dv="${whole(p.v)}"${p.g===null||p.g===undefined?'':` data-dg="${p.g}"`}></path>`;
  }).join('');
  return `<div class="dnut" data-dnut="${key}" style="width:${o.size}px;height:${o.size}px">
    <svg viewBox="0 0 200 200" role="img" aria-label="${esc(parts.map(p=>p.label+' '+p.pct.toFixed(1)+' percent').join(', '))}">${slices}</svg>
    <div class="dhole"><div class="dh-def">${o.center}</div><div class="dh-hov" aria-live="polite"></div></div></div>`;
}
let DONUT_ON = null;
function donutSet(key, i){
  document.querySelectorAll('[data-dk].on').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.dnut.hot').forEach(el=>el.classList.remove('hot'));
  DONUT_ON = key===null ? null : {key, i};
  if (key===null) return;
  const wrap = document.querySelector(`.dnut[data-dnut="${key}"]`), sl = wrap && wrap.querySelector(`path[data-di="${i}"]`);
  if (!wrap || !sl){ DONUT_ON = null; return; }
  document.querySelectorAll(`[data-dk="${key}"][data-di="${i}"]`).forEach(el=>el.classList.add('on'));
  wrap.classList.add('hot');
  const g = sl.dataset.dg, gp = g===undefined || g==='' ? '' : `<span class="num ${cls(+g)}" style="font-size:12px">${pct(+g)}</span>`;
  wrap.querySelector('.dh-hov').innerHTML = `<span class="num dh-n" style="color:${sl.getAttribute('fill')}">${sl.dataset.dn}</span>
    <span class="num" style="font-size:18px;color:var(--white)">${sl.dataset.dp}</span>
    <span class="num" style="font-size:12px;color:var(--dim)">${sl.dataset.dv}</span>${gp}`;
}

function exDateFor(y, m){ // first trading day of the month (skips weekends, New Year's Day and Labor Day)
  let t = Date.UTC(y, m, 1);
  const closed = d => { const w = d.getUTCDay(), day = d.getUTCDate(); return w===0 || w===6 || (m===0 && day===1) || (m===8 && w===1 && day<=7); };
  while (closed(new Date(t))) t += DAY;
  return new Date(t).toISOString().slice(0,10);
}
function payDateFor(ex){ let t = Date.parse(ex+'T00:00:00Z'), n = 4; while (n>0){ t += DAY; const w = new Date(t).getUTCDay(); if (w!==0 && w!==6) n--; } return new Date(t).toISOString().slice(0,10); }
function exDatesBetween(a, b){ // ex-dividend dates after a, up to and including b
  const out = [], d = new Date(a+'T00:00:00Z'); let y = d.getUTCFullYear(), m = d.getUTCMonth();
  for (let k=0; k<240; k++){ const ex = exDateFor(y, m); if (ex>b) break; if (ex>a) out.push(ex); if (++m>11){ m=0; y++; } }
  return out;
}
function nextEx(from){ const d = new Date(from+'T00:00:00Z'); let y = d.getUTCFullYear(), m = d.getUTCMonth(); let ex = exDateFor(y, m); if (ex<=from){ if (++m>11){ m=0; y++; } ex = exDateFor(y, m); } return ex; }

function watchList(){ const out = []; P.pos.forEach(p=>{ if (!out.includes(p.sym)) out.push(p.sym); }); P.watch.forEach(s=>{ if (MARKET[s] && !out.includes(s)) out.push(s); }); return out; }

function seriesFor(sym){ return (LIVE.on && liveSeries(sym)) || sampleSeriesFor(sym); }
function sampleSeriesFor(sym){
  if (CACHE[sym]) return CACHE[sym];
  const N = TDATES.length, vol = volOf(sym), now = MARKET[sym][2], h = hashOf(sym);
  let s = h;
  const rnd = () => { s = (s + 0x6D2B79F5)|0; let t = Math.imul(s ^ (s>>>15), 1|s); t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t; return ((t ^ (t>>>14))>>>0)/4294967296; };
  const gauss = () => { let u=0, v=0; while(!u) u=rnd(); while(!v) v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const isStock = MARKET[sym][1]==='stock', off = h % 63;
  const eIdx = new Set(); if (isStock) for (let k=off; k<N; k+=63) if (k>0) eIdx.add(k);
  const isBnd = MARKET[sym][1]==='bond', acc = new Array(N).fill(1), exIdx = [];
  if (isBnd){
    for (let k=1;k<N;k++) if (TDATES[k].slice(5,7)!==TDATES[k-1].slice(5,7)) exIdx.push(k);
    const y = fundOf(sym)[2]/1200;
    for (let k=0;k<N;k++){ let last = -21, nxt = null; for (const e of exIdx){ if (e<=k) last = e; else { nxt = e; break; } } if (nxt===null) nxt = last+21; acc[k] = 1 + y*(k-last)/(nxt-last); }
  }
  // random walk pinned to the starting level, each sample trade price, and today's price; earnings days move more
  const anchors = [{i:0,p:now*(START_MULT[sym]||0.6)}];
  // (sample series only: used if live history is missing)
  anchors.push({i:N-1,p:now}); anchors.sort((a,b)=>a.i-b.i); anchors.forEach(a=>{ a.p /= acc[a.i]; });
  const lp = new Array(N); lp[0] = Math.log(anchors[0].p);
  for (let k=1;k<anchors.length;k++){
    const a=anchors[k-1], b=anchors[k]; if (b.i<=a.i) continue;
    const inc=[]; let S=0; for (let j=a.i+1;j<=b.i;j++){ S += gauss()*vol*(eIdx.has(j)?3.2:1); inc.push(S); }
    const corr = (Math.log(b.p)-Math.log(a.p)-S)/(b.i-a.i);
    for (let j=a.i+1;j<=b.i;j++) lp[j] = Math.log(a.p) + inc[j-a.i-1] + corr*(j-a.i);
  }
  const baseVol = ({stock:2.2e7,bond:6e6,crypto:5e6,etf:6e7})[MARKET[sym][1]] * (sym==='NVDA'?10 : sym==='TSLA'?4 : 1);
  const daily = [];
  for (let k=0;k<N;k++){
    const c = Math.exp(lp[k])*acc[k], o = k ? Math.exp(lp[k-1])*acc[k]*(1+gauss()*vol*0.25) : c;
    const hi = Math.max(o,c)*(1+Math.abs(gauss())*vol*0.5), lo = Math.min(o,c)*(1-Math.abs(gauss())*vol*0.5);
    const mv = k ? Math.abs(lp[k]-lp[k-1])/vol : 1;
    daily.push({time:TDATES[k], open:o, high:hi, low:lo, close:c, vol:Math.round(baseVol*(0.6+0.4*rnd()+0.35*mv))});
  }
  // events: earnings (E), dividends (D), splits (S)
  const events = [];
  eIdx.forEach(k=>events.push({i:k, type:'E', note:'Earnings report · '+pct((daily[k].close/daily[k-1].close-1)*100)+' that day'}));
  const f = fundOf(sym);
  if (isBnd) exIdx.forEach(k=>events.push({i:k, type:'D', note:'Monthly interest · $'+(daily[k].close*f[2]/1200*payFactor(sym, TDATES[k])).toFixed(2)+' per share · the price drops by about that much today'}));
  if (f[2]>0 && (isStock || sym==='SPY')) for (let k=(off+25)%63; k<N; k+=63) events.push({i:k, type:'D', note:'Dividend paid · $'+(daily[k].close*f[2]/100/4).toFixed(2)+' per share'});
  if (SPLITS[sym]){ const i = TDATES.findIndex(t=>t>=SPLITS[sym][0]); if (i>0) events.push({i, type:'S', note:SPLITS[sym][1]+' stock split · earlier prices adjusted to match'}); }
  events.sort((a,b)=>a.i-b.i);
  const lastE = eIdx.size ? Math.max(...eIdx) : null;
  const nextIn = lastE===null ? null : lastE+63-(N-1);
  return CACHE[sym] = {daily, events, nextE: nextIn===null ? null : {date:addBiz(TDATES[N-1], nextIn), days:nextIn}};
}
const liveBar = (b,p) => ({...b, close:p, high:Math.max(b.high,p), low:Math.min(b.low,p)});
function weekly(d){
  const out=[]; let cur=null, key=null;
  d.forEach(b=>{ const dt = new Date(b.time+'T00:00:00Z'); const mon = new Date(dt - ((dt.getUTCDay()+6)%7)*86400000).toISOString().slice(0,10);
    if (mon!==key){ key=mon; cur={...b}; out.push(cur); } else { cur.high=Math.max(cur.high,b.high); cur.low=Math.min(cur.low,b.low); cur.close=b.close; cur.vol+=b.vol; } });
  return out;

function sma(bars,n){ const out=[]; let sum=0; bars.forEach((b,i)=>{ sum+=b.close; if(i>=n) sum-=bars[i-n].close; if(i>=n-1) out.push({time:b.time, value:sum/n}); }); return out; }
const EV_COLOR = {E:'#a594d9', D:'#c9a34e', S:'#5fb3c9'};
function makeToT(times){ return date => { let lo=0, hi=times.length-1, ans=times[0]; while(lo<=hi){ const mid=(lo+hi)>>1; if (times[mid]<=date){ ans=times[mid]; lo=mid+1; } else hi=mid-1; } return ans; }; }
function markersFor(sym, times, opt){

/* ---------- financial statements: each company's annual reports (10-K filings), from Massive ---------- */
const FIN_C1 = '#5b86c9', FIN_C2 = '#c4793a';   // validated pair on the dark card (blue, orange)
const FINCACHE = {};
function finFor(sym){
  const d = FIN[sym]; if (!d || !d.income || !d.income.length) return null;
  if (FINCACHE[sym] && FINCACHE[sym].src===d) return FINCACHE[sym];
  const B = v => (v===null || v===undefined) ? null : v/1e9;          // dollars to $ billions
  const inc = d.income, bal = new Map((d.balance||[]).map(b=>[b.fy, b]));
  const col = (rows, k, conv) => rows.map(r=>r ? conv(r[k]) : null);
  const balRows = inc.map(r=>bal.get(r.fy) || null);
  const allNull = a => a.every(v=>v===null);
  const F = {src:d, years:inc.map(r=>r.fy),
    rev:col(inc,'rev',B), gp:col(inc,'gp',B), op:col(inc,'op',B), ni:col(inc,'ni',B), eps:col(inc,'eps',v=>v===undefined?null:v),
    assets:col(balRows,'assets',B), liab:col(balRows,'liab',B), equity:col(balRows,'equity',B),
    ca:col(balRows,'ca',B), cl:col(balRows,'cl',B), cash:col(balRows,'cash',B), debt:col(balRows,'debt',B)};
  // Banks and some others don't report gross profit or current assets; hide those rows instead of showing zeros.
  ['gp','ca','cl'].forEach(k=>{ if (allNull(F[k])) F[k] = null; });
  F.bank = !F.gp;
  return FINCACHE[sym] = F;
}
const fmtB = v => { if (v===null || v===undefined || !isFinite(v)) return '—'; if (Math.abs(v)<1e-9) return '$0'; const a = Math.abs(v), sg = v<0 ? '−' : ''; return sg + (a>=1000 ? '$'+(a/1000).toFixed(2)+'T' : a>=1 ? '$'+a.toFixed(1)+'B' : '$'+Math.round(a*1000)+'M'); };
const pctS = v => (v===null || v===undefined || !isFinite(v)) ? '—' : (v*100).toFixed(1)+'%';
const nz = f => v => (v===null || v===undefined || !isFinite(v)) ? '—' : f(v);   // show a dash for figures a company didn't report
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), n = x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function finBars(years, series, stacked, tip, title, W){
  const nar = W<500, H = nar ? 230 : 250, L = nar ? 50 : 62, R = nar ? 6 : 12, T = 26, B = 30, fs = nar ? 11 : 12;
  const tops = years.map((_,i)=> stacked ? series.reduce((a,s)=>a+Math.max(0,s.vals[i]),0) : Math.max(0,...series.map(s=>s.vals[i])));
  const mins = years.map((_,i)=> stacked ? 0 : Math.min(0,...series.map(s=>s.vals[i])));
  const max = Math.max(...tops), min = Math.min(...mins), step = niceStep(Math.max(max-min, 1e-6)/4);
  const yMax = Math.ceil(max/step)*step, yMin = Math.floor(min/step)*step;
  const y = v => T + (yMax-v)/(yMax-yMin)*(H-T-B), gw = (W-L-R)/years.length;
  let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">`;
  for (let v=yMin; v<=yMax+step/2; v+=step){ out += `<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${Math.abs(v)<step/1e3?'#4a5d74':'#1f2b38'}" stroke-width="1"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" fill="#8a97a8" font-size="${fs}" font-family="IBM Plex Mono, monospace">${nar ? fmtB(v).replace('.0B','B') : fmtB(v)}</text>`; }
  years.forEach((yr,i)=>{
    const x0 = L+i*gw, last = i===years.length-1;
    if (stacked){
      const bw = Math.min(56, gw*0.46), x = x0+(gw-bw)/2; let acc = 0;
      series.forEach((s,k)=>{ const v = Math.max(0,s.vals[i]), y1 = y(acc+v), y2 = y(acc) - (k>0?2:0); out += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y2-y1).toFixed(1)}" rx="3" fill="${s.color}"/>`; acc += v; });
      if (last) out += `<text x="${(x+bw/2).toFixed(1)}" y="${(y(acc)-8).toFixed(1)}" text-anchor="middle" fill="#e6ebf1" font-size="${fs}" font-family="IBM Plex Mono, monospace">${fmtB(acc)}</text>`;
    } else {
      const bw = Math.min(30, gw*0.3), gap = 2, start = x0+(gw-(bw*series.length+gap*(series.length-1)))/2;
      series.forEach((s,k)=>{ const v = s.vals[i], x = start+k*(bw+gap), y1 = y(Math.max(v,0)), y2 = y(Math.min(v,0));
        out += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y2-y1).toFixed(1)}" rx="3" fill="${s.color}"/>`;
      });
    }
    out += `<text x="${(x0+gw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="#aab4c3" font-size="${nar?11.5:12.5}" font-family="IBM Plex Sans, sans-serif">${nar ? 'FY '+String(yr).slice(2) : 'FY '+yr}</text>`;
    out += `<rect class="hit" x="${x0.toFixed(1)}" y="${T-14}" width="${gw.toFixed(1)}" height="${H-T-B+14}" fill="#ffffff" fill-opacity="0" data-tip="${esc(tip(i))}"/>`;
  });
  return out + '</svg>';
}
function finTable(years, rows){
  return `<details class="ftable"><summary>See the numbers</summary><div class="tscroll"><table>
    <thead><tr><th scope="col">$ billions</th>${years.map(y=>`<th scope="col">FY ${y}</th>`).join('')}</tr></thead>
    <tbody>${rows.filter(r=>r[1]).map(([n,vals,fmt,strong])=>`<tr${strong?' class="strong"':''}><th scope="row">${n}</th>${vals.map(v=>`<td>${(fmt||fmtB)(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
function spark(vals){
  const v = vals.filter(x=>x!==null && isFinite(x)); if (v.length<2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), W=84, H=26, p=4;
  const pts = v.map((x,i)=>[p+i*(W-2*p)/(v.length-1), hi===lo ? H/2 : H-p-(x-lo)/(hi-lo)*(H-2*p)]);
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="#8a97a8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="#e6ebf1"/></svg>`;
}
function vFin(sym){

    <p style="margin:0;font-size:16px;line-height:1.5;color:var(--muted)">${sym} is a fund. It holds many ${m[1]==='bond'?'bonds':m[1]==='crypto'?'units of a cryptocurrency':'companies'} instead of running a business, so it doesn’t publish an income statement or balance sheet. Pick a company from the watchlist to see its financials.</p></div>`;

  const st = FIN[sym], msg = (t, p) => `<div class="side-card"><span class="disp" style="font-size:26px;color:var(--white)">${t}</span><p style="margin:0;font-size:16px;line-height:1.5;color:var(--muted)">${p}</p></div>`;

  const F = finFor(sym);

  const Y = F.years, n = Y.length-1;
  const growth = (a, b) => a && b && a>0 ? (b/a-1)*100 : null;
  const revG = growth(F.rev[0], F.rev[n]), niG = growth(F.ni[0], F.ni[n]);
  const span = n===1 ? 'one year' : n+' years';
  const legend = items => `<span class="keys" style="font-size:14px;color:var(--soft)">${items.map(([c,l])=>`<span><i style="width:12px;height:12px;border-radius:3px;background:${c};display:block"></i>${l}</span>`).join('')}</span>`;
  const both = (...a) => `<div class="fwide">${finBars(...a, 640)}</div><div class="fnarrow">${finBars(...a, 360)}</div>`;
  const inc = both(Y, [{name:'Revenue',color:FIN_C1,vals:F.rev},{name:'Net income',color:FIN_C2,vals:F.ni}], false,
    i=>`<b>FY ${Y[i]}</b><br>Revenue ${fmtB(F.rev[i])}<br>Net income ${fmtB(F.ni[i])}<br>Net margin ${pctS(F.ni[i]/F.rev[i])}`, 'Revenue and net income for the last five fiscal years');
  const bal = both(Y, [{name:'Liabilities',color:FIN_C2,vals:F.liab},{name:'Equity',color:FIN_C1,vals:F.equity}], true,
    i=>`<b>FY ${Y[i]}</b><br>Total assets ${fmtB(F.assets[i])}<br>Liabilities ${fmtB(F.liab[i])}<br>Equity ${fmtB(F.equity[i])}`, 'Total assets split into liabilities and equity for the last five fiscal years');
  const div = (a,b) => a.map((x,i)=> (b[i] && x!==null) ? x/b[i] : null);
  const R = [
    ['From the income statement', [
      ['Revenue growth', [null].concat(F.rev.slice(1).map((r,i)=>r/F.rev[i]-1)), pctS, 'This year’s revenue ÷ last year’s revenue − 1', 'How fast sales are growing.'],

      ${n>0 && revG!==null ? `<p class="fnote">Over ${span}, revenue ${revG>=0?'grew':'fell'} <b>${Math.abs(revG).toFixed(0)}%</b>${niG!==null ? ` and net income ${niG>=0?'grew':'fell'} <b>${Math.abs(niG).toFixed(0)}%</b>` : F.ni[0]!==null && F.ni[n]!==null ? (F.ni[n]>0 ? ' and the company went from a loss to a profit' : F.ni[0]>0 ? ' and the company went from a profit to a loss' : ' and the company lost money in both years') : ''}.</p>` : ''}

function wlResults(){
  const q = (UI.wq||'').trim().toLowerCase(); if (!q) return '';
  const pool = Object.keys(MARKET).map(s=>[s,MARKET[s][0]]).concat(REF.filter(r=>!MARKET[r[0]]).map(r=>[r[0],r[1]]));

let CH = null;
function mountChart(){
  const el = document.getElementById('chart'); if (!el) return;
  if (!window.LightweightCharts){ el.innerHTML = '<p class="empty" style="padding:24px">The chart didn’t load. Check your connection and refresh the page.</p>'; return; }
  const c = UI.chart, sym = c.sym, wk = c.tf==='5Y';
  if (LIVE.on && (!liveSeries(sym) || (c.cmp && !liveSeries('SPY')))) return;
  const daily = seriesFor(sym).daily.slice(); const L = daily.length-1; daily[L] = liveBar(daily[L], prices[sym]);
  const bars = wk ? weekly(daily) : daily;
  const fromIdx = wk ? 0 : Math.max(0, bars.length-1-({'1M':21,'3M':63,'6M':126,'1Y':252})[c.tf]);
  const chart = LightweightCharts.createChart(el, {autoSize:true,
    layout:{background:{type:'solid',color:'#141e29'}, textColor:'#aab4c3', fontFamily:"'IBM Plex Mono', ui-monospace, monospace", fontSize:12, attributionLogo:true},
    grid:{vertLines:{color:'#1b2633'}, horzLines:{color:'#1b2633'}},
    rightPriceScale:{borderColor:'#2a3847'}, timeScale:{borderColor:'#2a3847', rightOffset:3}, crosshair:{mode:0}});
  const out = {chart, sym, bars, cmp:!!c.cmp};
  const marks = markersFor(sym, bars.map(b=>b.time), {trades:c.marks, events:c.ev, wk});
  let spyBars = null;
  if (c.cmp){
    const sd = seriesFor('SPY').daily.slice(); sd[sd.length-1] = liveBar(sd[sd.length-1], prices.SPY);
    const sRaw = wk ? weekly(sd) : sd, sTo = makeToT(sRaw.map(b=>b.time)), sBy = new Map(sRaw.map(b=>[b.time,b]));
    spyBars = bars.map(b=>({...sBy.get(sTo(b.time)), time:b.time}));   // line up the S&P with this stock's trading days
    out.b0 = bars[fromIdx].close; out.sb0 = spyBars[fromIdx].close;
    const fmt = {type:'custom', minMove:0.01, formatter:v=>(v>=0?'+':'')+v.toFixed(1)+'%'};
    const spyS = chart.addLineSeries({color:'#8a97a8', lineWidth:2, lineStyle:2, priceFormat:fmt, priceLineVisible:false});
    spyS.setData(spyBars.map(b=>({time:b.time, value:(b.close/out.sb0-1)*100})));
    const me = chart.addLineSeries({color:'#ef5b70', lineWidth:3, priceFormat:fmt});
    me.setData(bars.map(b=>({time:b.time, value:(b.close/out.b0-1)*100})));
    if (marks.length) me.setMarkers(marks);
    out.main = me;
  } else {
    const candle = chart.addCandlestickSeries({upColor:'#45c08a', downColor:'#f0606f', borderVisible:false, wickUpColor:'#45c08a', wickDownColor:'#f0606f'});
    candle.priceScale().applyOptions({scaleMargins:{top:0.08, bottom:0.24}});
    candle.setData(bars.map(b=>({time:b.time, open:b.open, high:b.high, low:b.low, close:b.close})));
    const volS = chart.addHistogramSeries({priceFormat:{type:'volume'}, priceScaleId:'', lastValueVisible:false, priceLineVisible:false});
    volS.priceScale().applyOptions({scaleMargins:{top:0.8, bottom:0}});
    volS.setData(bars.map(b=>({time:b.time, value:b.vol, color:b.close>=b.open?'rgba(69,192,138,.32)':'rgba(240,96,111,.32)'})));
    if (c.ma){
      const opt = col => ({color:col, lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      chart.addLineSeries(opt('#c9a34e')).setData(sma(bars, wk?10:50));
      chart.addLineSeries(opt('#6b8fbf')).setData(sma(bars, wk?40:200));
    }
    if (marks.length) candle.setMarkers(marks);
    out.main = candle;
  }
  if (wk) chart.timeScale().fitContent(); else chart.timeScale().setVisibleLogicalRange({from:fromIdx, to:bars.length-1+3});
  const leg = document.getElementById('ohlc');
  const evAt = {};
  if (c.ev){ const toT = makeToT(bars.map(b=>b.time)); seriesFor(sym).events.forEach(e=>{ if (wk && e.type==='D') return; const t = toT(e.t || TDATES[e.i]); (evAt[t] = evAt[t] || []).push(e); }); }
  out.showAt = (i) => {
    if (!leg) return; i = Math.max(0, Math.min(bars.length-1, i)); const b = bars[i];
    const evs = (evAt[b.time]||[]).map(e=>`<span style="color:${EV_COLOR[e.type]}">${e.note}</span>`).join('');
    if (out.cmp){ const sb = spyBars[i];
      leg.innerHTML = `<span>${dLabel(b.time)}${wk?' week':''}</span><span style="color:#ef5b70">${sym} ${sgnp((b.close/out.b0-1)*100)}</span><span>S&amp;P 500 ${sgnp((sb.close/out.sb0-1)*100)}</span>${evs}`; }
    else leg.innerHTML = `<span>${dLabel(b.time)}${wk?' week':''}</span><span>O ${b.open.toFixed(2)}</span><span>H ${b.high.toFixed(2)}</span><span>L ${b.low.toFixed(2)}</span><span class="${cls(b.close-b.open)}">C ${b.close.toFixed(2)}</span><span>Vol ${fmtVol(b.vol)}</span>${evs}`;
  };
  out.hover = false;
  chart.subscribeCrosshairMove(p => { const has = p && p.logical!==undefined && p.logical!==null && p.point; out.hover = !!has; out.showAt(has ? Math.round(p.logical) : bars.length-1); });
  out.showAt(bars.length-1);
  CH = out;
}

function awardsList(key){

      sub:secLabel(D.sections[s.sec])+' · '+s.school, stats:a.stats, lesson:a.lesson};
  }).filter(Boolean);
  const pd = popularDown(key); if (pd) out.push(pd);

const perNum = p => { const m = String(p||'').match(/\d+/); return m ? +m[0] : 99; };
/* Every award card shows three levels at once: the district, a school, and a class.
   The school and class follow the leaderboard filter when one is picked, else the viewer's own,
   else Hersey and its first class. */
function awardTiers(){
  const sec = UI.sec!==null ? D.sections[UI.sec] : null;
  const ti = sec ? sec.ti : (UI.ti!==null && T[UI.ti]) ? UI.ti : null;
  const mine = ME ? D.sections[ME.sec] : null;
  const myT = ROLE==='teacher' && ME_INFO ? T.findIndex(t=>t[2]===ME_INFO.id) : -1;
  const home = mine ? mine.school : (ME_INFO && ME_INFO.school) || 'Hersey';
  const sch = sec ? sec.school : ti!==null ? T[ti][1] : UI.school || home;
  const inSch = D.sections.filter(s=>s.school===sch).sort((a,b)=>perNum(a.period)-perNum(b.period) || a.teacher.localeCompare(b.teacher));
  const c = sec
    || (ti!==null ? inSch.find(s=>s.ti===ti) : null)
    || (mine && mine.school===sch ? mine : null)
    || (myT>=0 ? inSch.find(s=>s.ti===myT) : null)
    || inSch[0] || null;
  const tiers = [{key:'district', kind:'district', tag:'District', title:'District 214', lg:logo('District 214',22)},
    {key:'school:'+sch, kind:'school', tag:sch, title:sch, lg:logo(sch,22)}];
  if (c) tiers.push({key:'class:'+c.dbId, kind:'class', tag:c.period+' · '+c.teacher, title:c.period+' · '+c.teacher, lg:''});
  tiers.forEach(t=>{ t.list = awardsList(t.key); });
  return tiers;
}
/* One card per award, in the order the district shows them; the most-owned stock comes last. */
function awardCards(tiers){
  const seen = new Map();
  for (const t of tiers) for (const a of t.list){ const k = a.stock ? 'popular' : a.kind; if (!seen.has(k)) seen.set(k, a.stock ? 'Most Owned Stock' : a.label); }
  const out = [...seen].filter(([k])=>k!=='popular').map(([kind,label])=>({kind,label}));
  if (seen.has('popular')){
    const d = tiers[0].list.find(a=>a.stock);
    out.push({kind:'popular', label: d ? d.label : 'Most Owned Stock'});
  }
  return out;
}

function popularDown(key){
  const p = ST && ((ST.popularBy && ST.popularBy[key||'district']) || (!ST.popularBy && (key||'district')==='district' && ST.popular)); if (!p) return null;
  if (!MARKET[p.sym]){ const q = ST.quotes[p.sym] || {p:0, pc:0}; MARKET[p.sym] = [p.name, 'stock', q.p, q.pc]; prices[p.sym] = q.p; prev[p.sym] = q.pc || q.p; }
  const down = p.chg<0;
  return {kind:'popular', stock:p.sym, label: down?'Most Owned · Down Today':'Most Owned Stock', value:pct(p.chg), name:p.name, owners:p.owners, good:null, chg:p.chg,
    lesson: (p.owners===1 ? '1 student owns it. ' : p.owners+' students own it. ') + (down ? 'On sale, or slipping? Check the chart before you decide.' : 'No popular stock is down right now.')};
}

function checkup(){
  const t = totals();
  const longs = P.pos.filter(p=>p.side==='long');
  const big = longs.map(p=>({sym:p.sym,w:posValue(p)/t.total*100})).sort((a,b)=>b.w-a.w)[0] || {sym:'none',w:0};
  const cashPct = P.cash/t.total*100;
  const losers = P.pos.filter(p=>posGain(p)<0);
  const sectorish = new Set(longs.map(p=>MARKET[p.sym][1]==='stock'?p.sym:MARKET[p.sym][1])).size;
  const vsG = t.vs>=1?'A':t.vs>=0?'B':t.vs>=-2?'C':'D';
  const spG = big.w<=15?'A':big.w<=20?'B':big.w<=30?'C':'D';
  const caG = cashPct<5?'A':cashPct<10?'B':cashPct<20?'C':'D';
  const loG = losers.length===0?'A':losers.length===1?'B':losers.length===2?'C':'D';
  const pts = {A:4,B:3,C:2,D:1}; const avg = (pts[vsG]+pts[spG]+pts[caG]+pts[loG])/4;
  const overall = avg>=3.75?'A':avg>=3.4?'A−':avg>=3.1?'B+':avg>=2.75?'B':avg>=2.4?'B−':avg>=2.1?'C+':avg>=1.75?'C':'D';
  return { overall, grades:[
    {l:'Vs. market',g:vsG,stat:(t.vs>=0?'+':'−')+Math.abs(t.vs).toFixed(2)+' pts',what:t.vs>=0?'You’re beating the S&P 500.':'The S&P 500 is ahead of you.',fix:t.vs>=0?'Keep it up. Check again next week.':'Compare your picks to the market. What’s dragging?'},
    {l:'Spread out',g:spG,stat:Math.round(big.w)+'% in '+big.sym,what:big.w>20?'One stock holds a big share of your money.':'No single stock dominates your portfolio.',fix:big.w>20?'Get your biggest stock under 20%.':'Nice balance. Keep each position under 20%.'},
    {l:'Cash',g:caG,stat:Math.round(cashPct)+'% idle',what:'Uninvested cash doesn’t grow.',fix:cashPct>=10?'Invest it or move it to the money market. Keep cash under 10%.':'Good. A little cash lets you buy dips.'},
    {l:'Losers',g:loG,stat:losers.length+' of '+P.pos.length+' down',what:losers.length?(losers.map(p=>p.sym).join(', ')+' '+(losers.length>1?'are':'is')+' losing money.'):'Every position is in the green.',fix:losers.length?'Decide: hold, or cut the loss?':'Set a plan for when to take profits.'}
  ], checks:[
    ['Own 5 or more investments', P.pos.length+(P.mm.bal>0?1:0), P.pos.length+(P.mm.bal>0?1:0)>=5],
    ['3 or more kinds of investments', sectorish>=3?sectorish:sectorish, sectorish>=3],
    ['Beating the S&P 500', (t.vs>=0?'+':'−')+Math.abs(t.vs).toFixed(2), t.vs>=0],
    ['No stock over 20%', Math.round(big.w)+'%', big.w<=20],
    ['Cash under 10%', Math.round(cashPct)+'%', cashPct<10],
    ['Traded this week', P.tradesWeek, P.tradesWeek>0]
  ]};
}

          <li><span class="fwhen">Now</span><span class="num famt">−${whole(tr.mmAmt)}</span><span class="fwhat">Leaves your cash and goes into the money market.</span></li>
          <li><span class="fwhen">Every day</span><span class="num famt up">+${money(amtPerDay)}</span><span class="fwhat">Interest is added to your balance, and tomorrow you earn interest on that too.</span></li>

            <li><span class="fwhen">If it dips 10%</span><span class="num famt up">${fmtSh(+low.toFixed(3))} sh</span><span class="fwhat">The same ${whole(amt)} buys more shares.</span></li>

// What the student already holds of this ticker, shown under the price on the Trade page.
function ownedHtml(sym){
  const held = P.pos.filter(p=>p.sym===sym);
  if (!held.length) return `<div class="bondnote" style="font-size:15px"><span class="tag" style="color:var(--dim)">YOU OWN</span><span>None yet.</span></div>`;
  return held.map(p=>{
    const short = p.side==='short', g = posGain(p), gp = g/(p.n*p.b)*100, v = posValue(p);
    return `<div class="bondnote" style="font-size:16px;justify-content:space-between;flex-wrap:wrap;gap:10px 16px">
      <span style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="tag" style="color:${short?'var(--warn)':'var(--link)'}">${short?'YOU’RE SHORT':'YOU OWN'}</span>
        <span><b class="num" style="color:var(--white)">${fmtSh(+p.n.toFixed(4))}</b> ${p.n===1?'share':'shares'} · worth <b class="num" style="color:var(--white)">${money(v)}</b> · ${short?'shorted':'bought'} at ${money(p.b)} avg ·
        <span class="num ${cls(g)}">${signed2(g)} (${pct(gp)})</span></span></span>
      <button type="button" class="chip" style="min-height:38px" data-act="sheet:pos:${sym}:${p.side}">${short?'Close short':'Sell'}</button></div>`;
  }).join('');
}
// A number box students can type in, between the − and + buttons.
function numIn(k, v, dollars){
  const raw = UI.raw && UI.raw[k] !== undefined ? UI.raw[k] : (dollars ? String(Math.round(v*100)/100) : String(+(+v).toFixed(4)));
  return `<label class="stepin">${dollars ? '<span aria-hidden="true">$</span>' : ''}<input type="text" inputmode="decimal" autocomplete="off" id="num-${k}" data-k="${k}" value="${esc(raw)}" aria-label="${dollars ? 'Dollar amount' : 'Number of shares'}"></label>`;
}
function setNum(k, val){
  const n = Number(String(val).replace(/[$,\s]/g, ''));
  const v = isFinite(n) && n > 0 ? Math.round(n*10000)/10000 : 0;
  const tr = UI.trade, sh = UI.sheet;
  if (k==='n') tr.n = v; else if (k==='amt') tr.amt = v; else if (k==='mmAmt') tr.mmAmt = v;
  else if (k==='bn' && sh) sh.bn = v;
  else if (k==='sn' && sh){ const p = P.pos.find(x=>'pos:'+x.sym+':'+x.side===sh.key); sh.n = p ? Math.min(v, p.n) : v; }
}
function chipsHtml(){
  const tr = UI.trade, q = tr.q.trim().toLowerCase();
  const list = Object.keys(MARKET).filter(s=>MARKET[s][1]===tr.type && (!q || s.toLowerCase().includes(q) || MARKET[s][0].toLowerCase().includes(q)));
  if (tr.type==='stock' && q) REF.filter(r=>!MARKET[r[0]] && (r[0].toLowerCase().includes(q) || r[1].toLowerCase().includes(q))).slice(0,8).forEach(r=>list.push(r[0]));
  if (LIVE.on && q && (tr.type==='stock' || tr.type==='etf')){
    liveSearch(tr.q, ()=>{ const ch = document.getElementById('chips'); if (ch) ch.innerHTML = chipsHtml(); });
    liveHits(tr.q, tr.type).forEach(h=>{ if (!list.includes(h.s) && list.length<16 && (!MARKET[h.s] || MARKET[h.s][1]===tr.type)) list.push(h.s); });
    if (!list.length) return `<span class="empty">${LIVE.searching[tr.q.trim()] || !LIVE.hits[tr.q.trim()] ? 'Searching…' : 'No U.S. '+(tr.type==='etf'?'ETF':'stock')+' matches that.'}</span>`;
  }
  if (!list.length) return `<span class="empty">No match in the demo list. The real app will search every U.S. ticker.</span>`;
  return list.map(s=>`<button type="button" class="chip num" aria-pressed="${tr.pick[tr.type]===s}" data-act="pick:${s}">${s}</button>`).join('');
}

/* Everyone in one class, best return first. Tapping a name opens that student's portfolio. */
function classRoster(secId){
  const l = D.students.filter(s=>s.sec===secId).sort((a,b)=>b.ret-a.ret);
  if (!l.length) return '<p class="empty">No students in this class yet.</p>';
  const top = Math.max(0.01, ...l.map(s=>Math.abs(s.ret)));
  return `<div class="spread"><span class="label">Everyone in this class</span><span style="color:var(--dim);font-size:13px">Tap a name to see their portfolio</span></div>
    <div class="roster">${l.map((s,i)=>{ const value = s.isMe ? totals().total : 100000*(1+s.ret/100);
      return `<button type="button" class="${s.isMe?'me':''}" data-act="open:student:${s.id}">

        <span class="nm"><span>${esc(s.name)}${s.isMe?' <span class="small">(you)</span>':''}</span><span class="bar"><i style="width:${Math.max(2,Math.abs(s.ret)/top*100).toFixed(1)}%;background:${s.ret>=0?'var(--up)':'var(--down)'}"></i></span></span>
        <span class="r" style="color:var(--soft)">${whole(value)}</span>
        <span class="r ${cls(s.ret)}">${pct(s.ret)}</span></button>`; }).join('')}</div>`;
}

/* ---------- talking to the server ---------- */
async function call(fn, body, qs){
  const r = await fetch('/api/app?fn='+fn+(qs||''), body===undefined
    ? {headers:{Accept:'application/json'}, credentials:'same-origin'}
    : {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json', 'x-d214':'1', Accept:'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (r.status===401 && fn!=='login' && fn!=='me'){ signedOut(); }
  if (!r.ok){ const e = new Error(j.error || 'Something went wrong. Try again in a minute.'); e.status = r.status; throw e; }
  return j;
}
const errBox = () => UI.err ? `<div class="err" role="alert">${esc(UI.err)}</div>` : '';
function tradingOpen(){ return SETTINGS.trading!==false && (!LIVE.status || !LIVE.status.market || LIVE.status.market==='open'); }
function closedBox(kind){
  if (SETTINGS.trading===false) return `<div class="bondnote"><span class="tag" style="color:var(--warn)">PAUSED</span><span>Trading is paused right now. Check with your teacher.</span></div>`;
  if (kind!=='mm' && !tradingOpen()) return `<div class="bondnote"><span class="tag" style="color:var(--warn)">CLOSED</span><span>The market is closed. Trades go through 8:30 AM to 3:00 PM Central on days the market is open. You can still move money in and out of the money market.</span></div>`;
  return '';
}
// Send a change to the server. On success the server's copy of the portfolio replaces ours.
let BUSY = false;
async function change(body, el, onDone){
  if (BUSY) return;
  BUSY = true; UI.err = null;
  if (el) el.setAttribute('aria-busy','true');
  try{
    const r = await call('act', body);
    applyState(r);
    if (onDone) onDone(r.result || {});
    if (['trade','mm','dca_start'].includes(body.a)) loadStandings();
  }catch(e){ UI.err = e.message; }
  finally{ BUSY = false; const y = window.scrollY; render(); window.scrollTo(0, y); }
}

/* ---------- actions ---------- */
function act(a, el){
  const [k, ...rest] = a.split(':'); const v = rest.join(':'); const tr = UI.trade;
  // live data: a ticker the page doesn't know yet gets its real price before it can be picked or charted
  if (LIVE.on && ['pick','wadd','csym','chartsym'].includes(k) && v && !MARKET[v]){
    if (el) el.setAttribute('aria-busy','true');
    liveAdd(v).then(ok=>{ if (ok) act(a); else { if (el) el.removeAttribute('aria-busy'); alert('Couldn’t load a price for '+v+' right now. Try again in a minute.'); } });
    return;
  }
  if (!['sheet','smode','bn','sn','n','amt','mmamt','pick','side','freq','mmdir'].includes(k)) UI.err = null;
  UI.raw = {};   // a button press replaces anything typed in the number boxes
  switch(k){
    case 'tab': UI.tab=v; break;
    case 'school': UI.school=v||null; UI.ti=null; UI.sec=null; break;
    case 'ti': UI.ti = v===''?null:+v; UI.sec=null; break;
    case 'sec': UI.sec = v===''?null:+v; if (UI.sec!==null) UI.ti = D.sections[UI.sec].ti; break;
    case 'aw': { const o = awardScopeOptions().find(x=>x.key===v); if (v==='district'){ UI.school=null; UI.ti=null; UI.sec=null; } else if (o){ Object.assign(UI, o.set); } break; }
    case 'open': UI.back = v.startsWith('student:') && UI.drawer && UI.drawer.startsWith('class:') ? UI.drawer : null; UI.drawer=v; break;
    case 'close': UI.back=null; UI.drawer=null; UI.sheet=null; UI.guide=false; UI.modal=null; break;
    case 'clearerr': UI.err = null; break;
    case 'sheet': { if (v==='mm'){ tr.type='mm'; tr.mmDir='out'; tr.mmAmt=1000; tr.done=null; location.hash='#trade'; break; } const pos = v.startsWith('pos:') ? P.pos.find(x=>'pos:'+x.sym+':'+x.side===v) : null; UI.sheet={key:v,n:pos?pos.n:0,mode:'sell',bn:1}; break; }
    case 'smode': UI.sheet.mode = v; UI.sheet.done = null; break;
    case 'bn': { const sym = UI.sheet.key.split(':')[1], mx = Math.max(1, Math.floor(P.cash/prices[sym]));
      UI.sheet.bn = v==='max' ? mx : Math.max(1, (UI.sheet.bn||1)+(v==='+'?1:-1)); break; }
    case 'buymore': {
      const [,sym] = UI.sheet.key.split(':'), n = UI.sheet.bn||1;
      change({a:'trade', sym, side:'buy', n}, el, r=>{ if (UI.sheet) UI.sheet.done = {title:'Bought '+fmtSh(n)+' more '+sym, sub:'at '+money(r.price)+' · '+money(r.total)}; });
      return;
    }
    case 'sn': { const p = P.pos.find(x=>'pos:'+x.sym+':'+x.side===UI.sheet.key); UI.sheet.n = v==='all'?p.n : Math.max(Math.min(1,p.n),Math.min(p.n, Math.floor(UI.sheet.n)+(v==='+'?1:-1))); break; }
    case 'sell': {
      const [,sym,side] = UI.sheet.key.split(':'); const p = P.pos.find(x=>x.sym===sym&&x.side===side); if (!p) return;
      const n = Math.min(UI.sheet.n, p.n);
      change({a:'trade', sym, side: side==='long'?'sell':'cover', n}, el, r=>{ if (UI.sheet) UI.sheet.done = {title:(side==='short'?'Closed ':'Sold ')+fmtSh(n)+' '+sym, p:r.pnl}; });
      return;
    }
    case 'dismiss': P.notes = []; change({a:'dismiss'}); return;
    case 'type': tr.type=v; tr.done=null; tr.mmAmt=1000; tr.side='buy'; tr.n=10; tr.q=''; tr.freq='once'; break;
    case 'pick': ensureSym(v); tr.pick[tr.type]=v; break;
    case 'side': tr.side=v; if (v==='short') tr.freq='once'; break;
    case 'freq': tr.freq=v; break;
    case 'amt': tr.amt = Math.max(100, tr.amt + (v==='+'?100:-100)); break;
    case 'dcastart': {
      const sym = tr.pick[tr.type], amt = tr.amt, freq = tr.freq;
      change({a:'dca_start', sym, amt, freq}, el, r=>{ tr.done = {title:'Auto-investing in '+sym, sub:whole(amt)+' '+DCA_FREQ[freq][1]+' · first buy done · next '+fmtDay(r.next)}; tr.freq='once'; });
      return;
    }
    case 'dcatog': change({a:'dca_toggle', id:v}, el); return;
    case 'dcastop': if (!confirm('Stop this auto-invest plan? The shares it already bought stay in your portfolio.')) return; change({a:'dca_stop', id:v}, el); return;
    case 'n': tr.n = Math.max(1, tr.n+(v==='+'?1:-1)); break;
    case 'mmdir': tr.mmDir = v; tr.mmAmt = 1000; break;
    case 'mmamt': { const avail = tr.mmDir==='in' ? P.cash : P.mm.bal;
      tr.mmAmt = v==='all' ? Math.floor(avail*100)/100 : Math.max(500, Math.round(tr.mmAmt/500)*500 + (v==='+'?500:-500)); break; }
    case 'newtrade': tr.done=null; tr.mmAmt=1000; tr.n=10; break;
    case 'submit': {
      const sym = tr.pick[tr.type], n = tr.n, side = (tr.type==='bond'||tr.side==='buy') ? 'buy' : 'short';
      change({a:'trade', sym, side, n}, el, r=>{ tr.done = {title:(side==='buy'?'Bought ':'Shorted ')+fmtSh(n)+' '+sym, sub:'at '+money(r.price)+' · '+money(r.total)}; });
      return;
    }
    case 'mmmove': {
      const isIn = tr.mmDir==='in';
      change({a:'mm', dir:isIn?'in':'out', amt:tr.mmAmt}, el, r=>{ tr.done = {title:'Moved '+money(r.amt)+' to '+(isIn?'money market':'cash'), sub:isIn ? 'Earning '+P.mm.rate.toFixed(2)+'% · about +'+money(mmPerDay())+' a day' : 'Money market balance: '+money(P.mm.bal)}; });
      return;
    }
    case 'csym': ensureSym(v); UI.chart.sym = v; break;
    case 'wadd': ensureSym(v); if (!watchList().includes(v)){ P.watch.push(v); if (canTrade()) call('act', {a:'watch', sym:v, on:true}).catch(()=>{}); } UI.chart.sym = v; UI.wq = ''; break;
    case 'wtog': { const on = !P.watch.includes(v); if (on) P.watch.push(v); else P.watch = P.watch.filter(x=>x!==v); if (canTrade()) call('act', {a:'watch', sym:v, on}).catch(()=>{}); break; }
    case 'guide': UI.guide = true; break;
    case 'tf': UI.chart.tf = v; break;
    case 'cview': UI.chart.view = v; break;
    case 'ctog': UI.chart[v] = !UI.chart[v]; break;
    case 'chartsym': UI.chart.sym = v; UI.sheet = null; UI.drawer = null; location.hash = '#charts'; break;
    case 'go': { const [side, sym] = v.split(':'); const ty = MARKET[sym][1];
      tr.type = ty; tr.pick[ty] = sym; tr.side = side; tr.n = 10; tr.q = ''; tr.done = null; location.hash = '#trade'; break; }
    case 'drip': change({a:'drip', sym:v}, el); return;
    default: if (moreActs(k, v, el)) return;
  }
  const y = window.scrollY;
  render();
  if (k==='tf' || k==='ctog' || k==='cview') window.scrollTo(0, y);
}

const LOGIN = {dir:null, school:null, kind:'student', teacher:null, tdir:null, sec:null, student:null, admin:false, err:null};
(function remember(){ try{ const m = JSON.parse(localStorage.getItem('d214login')||'null'); if (m){ LOGIN.school = m.school||null; LOGIN.kind = m.kind||'student'; } }catch(e){} })();
// A QR code on a sign-in slip opens the site with the school, teacher, class, and name already picked.
const GO = (function(){
  const m = (location.hash||'').match(/^#go=(s)\.(\d+)\.(\d+)\.(\d+)$|^#go=(t)\.(\d+)$/);
  if (!m) return null;
  history.replaceState(null, '', location.pathname);
  return m[1] ? {kind:'student', teacher:+m[2], sec:+m[3], student:+m[4]} : {kind:'teacher', teacher:+m[6]};

const focusPw = () => setTimeout(()=>{ const i = document.getElementById('lpw'); if (i) i.focus(); }, 0);
async function loadDir(){
  try{ LOGIN.dir = await call('dir'); }catch(e){ LOGIN.err = e.message; }
  if (LOGIN.school && !LOGIN.dir?.schools?.some(s=>s.name===LOGIN.school && s.teachers.length)) LOGIN.school = null;
  if (GO && !GO.done && LOGIN.dir){
    GO.done = true;
    const sch = LOGIN.dir.schools.find(s=>s.teachers.some(t=>t.id===GO.teacher));
    if (sch){
      Object.assign(LOGIN, {school:sch.name, kind:GO.kind, teacher:GO.teacher, admin:false, err:null});
      if (GO.kind==='student'){ render(); return loadTeacherDir(GO.teacher); }
      render(); return focusPw();
    }

  render();

async function loadTeacherDir(id){
  LOGIN.tdir = null; render();
  try{
    LOGIN.tdir = await call('dir', undefined, '&teacher='+id);
    if (LOGIN.tdir.sections.length===1) LOGIN.sec = LOGIN.tdir.sections[0].id;

      if (sec && sec.students.some(s=>s.id===GO.student)){ LOGIN.sec = sec.id; LOGIN.student = GO.student; render(); return focusPw(); }
    }
  }catch(e){ LOGIN.err = e.message; }
  render();
}

    return `<div class="ctr"><span style="display:flex;flex-direction:column;gap:3px"><span class="num" style="font-size:17px;color:var(--white)">${esc(t.sym)}${t.act==='cover'?' <span class="small">short</span>':''}</span>

function qrSvg(text){
