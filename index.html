// Actions for sign-in, teachers, and the admin. Returns true when it has handled rendering itself.
function moreActs(k, v, el){
  const L = LOGIN;
  switch(k){
    case 'lschool': L.school = v; L.teacher = null; L.err = null; break;
    case 'lkind': L.kind = v; break;
    case 'lteacher': L.teacher = +v; L.sec = null; L.student = null; L.err = null; if (L.kind==='student') { loadTeacherDir(+v); return true; } break;
    case 'lsec': L.sec = +v; L.student = null; break;
    case 'lstudent': L.student = +v; L.err = null; render(); setTimeout(()=>{ const i = document.getElementById('lpw'); if (i) i.focus(); }, 0); return true;
    case 'ladmin': L.admin = true; L.err = null; render(); setTimeout(()=>{ const i = document.getElementById('lpw'); if (i) i.focus(); }, 0); return true;
    case 'lback':
      L.err = null; L.admin = false;
      if (v==='all'){ L.school = null; L.teacher = null; L.tdir = null; L.sec = null; L.student = null; }
      else if (v==='teacher'){ L.teacher = null; L.tdir = null; L.sec = null; L.student = null; }
      else if (v==='sec'){ L.sec = null; L.student = null; }
      else L.student = null;
      break;
    case 'signout': call('logout', {}).catch(()=>{}).finally(()=>{ location.hash = ''; signedOut(); }); return true;
    case 'print': if (UI.slips) printSlips(UI.slips); return true;
    // teacher
    case 'tstu': UI.drawer = 'tstudent:'+v; break;
    case 'treset': {
      if (!confirm('Make a new password? The old one stops working right away.')) return true;
      call('teacher_act', {a:'reset_pw', studentId:+v}).then(r=>{
        UI.slips = [r.slip];
        UI.modal = {title:'New password', html:`<p style="margin:0;font-size:18px;color:var(--soft)">${esc(r.name)}’s new password:</p><span class="pw">${esc(r.pw)}</span>
          <div class="btnrow"><button type="button" class="cta" data-act="print">Print slip</button><button type="button" class="ghost" data-act="close">Done</button></div>`};
        render();
      }).catch(e=>{ alert(e.message); });
      return true;
    }
    case 'tremove': {
      if (!confirm('Remove this student from the class? They won’t be able to sign in or appear in the standings.')) return true;
      call('teacher_act', {a:'remove', studentId:+v}).then(()=>{ UI.drawer = null; loadClasses(); loadStandings(); }).catch(e=>alert(e.message));
      return true;
    }
    case 'tresetclass': {
      if (!confirm('Make new passwords for every student in this class? Their old passwords stop working right away.')) return true;
      call('teacher_act', {a:'reset_class', sectionId:+v}).then(r=>{
        UI.slips = r.slips;
        UI.modal = {title:'New passwords ready', html:`<p style="margin:0;font-size:18px;color:var(--soft)">${r.slips[0].students.length} new passwords. Print the slips and hand them out.</p>
          <div class="btnrow"><button type="button" class="cta" data-act="print">Print slips</button><button type="button" class="ghost" data-act="close">Done</button></div>`};
        render();
      }).catch(e=>alert(e.message));
      return true;
    }
    case 'tprint': {
      let fillTeacher = false;
      const go = fillMissing => call('teacher_act', {a:'slips', sectionId:+v, fillMissing, fillTeacher}).then(r=>{
        if (ROLE==='admin' && r.teacherMissing && !fillTeacher){
          const t = r.slips[0].teacher;
          if (confirm(t+'’s own password was made before it could be reprinted, so it can’t go on the sheet.\n\nMake '+t+' a new password and print it at the top? The old one stops working right away.')){ fillTeacher = true; return go(fillMissing); }
        }
        if (r.missing && !fillMissing){
          const n = r.missing, all = n===r.slips[0].students.length;
          if (confirm((all ? 'This class’s passwords were' : n+(n===1?' student’s password was':' students’ passwords were'))+' made before slips could be reprinted, so they can’t be shown.\n\nMake new passwords for '+(all ? 'the whole class' : 'just '+(n===1?'that student':'those '+n))+'? The old ones stop working right away.')) return go(true);
        }
        UI.slips = r.slips; printSlips(r.slips);
        if (r.renewed) loadClasses();
      }).catch(e=>alert(e.message));
      if (el) el.setAttribute('aria-busy','true');
      go(false).finally(()=>{ if (el) el.removeAttribute('aria-busy'); });
      return true;
    }
    case 'trename': {
      const se = CLS && CLS.sections.find(s=>s.id===+v);
      UI.modal = {title:'Rename class', html:`<form id="renameform" style="display:flex;flex-direction:column;gap:14px" data-sec="${+v}">
        <label for="rperiod" class="label">Class name</label><input id="rperiod" type="text" autocomplete="off" value="${esc(se ? se.period : '')}" required>
        <span class="small">Type the period, like 7 or Period 7. It shows as P7. Students, passwords, and portfolios don’t change.</span>
        <button type="submit" class="go">Save</button></form>`};
      render(); setTimeout(()=>{ const i = document.getElementById('rperiod'); if (i){ i.focus(); i.select(); } }, 0);
      return true;
    }
    case 'tadd': {
      UI.modal = {title:'Add a student', html:`<form id="addform" style="display:flex;flex-direction:column;gap:14px" data-sec="${+v}">
        <label for="afirst" class="label">First name</label><input id="afirst" type="text" autocomplete="off" required>
        <label for="alast" class="label">Last name</label><input id="alast" type="text" autocomplete="off" required>
        <span class="small">Only the first name and last initial are saved and shown.</span>
        <button type="submit" class="go">Add student</button></form>`};
      render(); setTimeout(()=>{ const i = document.getElementById('afirst'); if (i) i.focus(); }, 0);
      return true;
    }
    // admin
    case 'aview': UI.adminTeacher = v ? +v : null; CLS = null; loadClasses(); location.hash = '#classes'; return true;
    case 'apreview': case 'aimport': {
      const csv = (document.getElementById('acsv')||{}).value || ''; UI.csv = csv;
      if (!csv.trim()){ UI.err = 'Paste the roster first.'; break; }
      if (k==='aimport' && !confirm('Import '+UI.preview.totals.newStudents+' new students?')) return true;
      if (el) el.setAttribute('aria-busy','true');
      call('admin_act', {a:'import', csv, commit:k==='aimport'}).then(r=>{
        UI.err = null; UI.preview = r;
        if (k==='aimport'){ UI.slips = r.slips; UI.preview = null; UI.csv = '';
          UI.modal = {title:'Roster imported', html:`<p style="margin:0;font-size:18px;color:var(--soft)">${r.totals.newStudents} new students and ${r.totals.newTeachers} new teachers have passwords. Print the slips now: passwords can’t be shown again (but they can be reset).</p>
            <div class="btnrow"><button type="button" class="cta" data-act="print">Print login slips</button><button type="button" class="ghost" data-act="close">Later</button></div>`};
          loadAdmin(); loadStandings(); }
      }).catch(e=>{ UI.err = e.message; }).finally(()=>render());
      return true;
    }
    case 'asave': {
      const num = id => Number((document.getElementById(id)||{}).value);
      call('admin_act', {a:'settings', mmRate:num('amm'), minPrice:num('amin'), minShortPrice:num('ashort')})
        .then(s=>{ ADM.settings = s; SETTINGS = s; UI.err = null; UI.modal = {title:'Saved', html:'<p style="margin:0;color:var(--soft)">Settings saved.</p><button type="button" class="ghost" data-act="close">OK</button>'}; })
        .catch(e=>{ UI.err = e.message; }).finally(()=>render());
      return true;
    }
    case 'atrading': {
      const on = !ADM.settings.trading;
      if (!on && !confirm('Pause all trading for every student?')) return true;
      call('admin_act', {a:'settings', trading:on}).then(s=>{ ADM.settings = s; SETTINGS = s; }).catch(e=>{ UI.err = e.message; }).finally(()=>render());
      return true;
    }
    case 'aeod': {
      if (el) el.setAttribute('aria-busy','true');
      call('admin_act', {a:'eod'}).then(r=>{ UI.eodLog = r.log; loadAdmin(); loadStandings(); }).catch(e=>{ UI.err = e.message; }).finally(()=>render());
      return true;
    }
    case 'aclassremove': {
      const se = CLS && CLS.sections.find(s=>s.id===+v); if (!se) return true;
      if (!confirm('Remove '+se.teacher+' · '+se.period+' and its '+se.students.length+' students? They won’t be able to sign in and will leave the standings. Use this for a wrong or duplicate roster.')) return true;
      call('admin_act', {a:'class_remove', sectionId:+v}).then(()=>{ loadClasses(); loadStandings(); loadAdmin(); }).catch(e=>alert(e.message));
      return true;
    }
    case 'atpw': {
      if (!confirm('Make a new password for this teacher? The old one stops working.')) return true;
      call('admin_act', {a:'teacher_pw', teacherId:+v}).then(r=>{
        UI.slips = [r.slip];
        UI.modal = {title:'New teacher password', html:`<p style="margin:0;font-size:18px;color:var(--soft)">${esc(r.name)}’s new password:</p><span class="pw">${esc(r.pw)}</span>
          <div class="btnrow"><button type="button" class="cta" data-act="print">Print slip</button><button type="button" class="ghost" data-act="close">Done</button></div>`};
      }).catch(e=>{ UI.err = e.message; }).finally(()=>render());
      return true;
    }
    case 'aresetall': {
      const c = (document.getElementById('areset')||{}).value || '';
      if (c!=='RESET'){ UI.err = 'Type RESET in the box to confirm.'; break; }
      if (!confirm('Last check: put every student back to $100,000 and erase all trades?')) return true;
      call('admin_act', {a:'reset_all', confirm:'RESET'}).then(()=>{ UI.err = null; UI.modal = {title:'Fresh start', html:'<p style="margin:0;color:var(--soft)">Every student is back to $100,000. The S&amp;P 500 comparison starts now.</p><button type="button" class="ghost" data-act="close">OK</button>'}; loadAdmin(); loadStandings(); })
        .catch(e=>{ UI.err = e.message; }).finally(()=>render());
      return true;
    }
  }
  return false;
}

/* ---------- loading data ---------- */
function applyState(r){
  P = Object.assign(EMPTY(), r.P);
  HISTORY = r.history || [];
  SETTINGS = r.settings || SETTINGS;
  Object.entries(r.meta||{}).forEach(([s, m])=>{ if (!MARKET[s]) MARKET[s] = [m[0]||s, m[1]||'stock', 0, 0]; else if (m[1]) MARKET[s][1] = m[1]; });
  Object.keys(r.quotes||{}).forEach(s=>{ if (!MARKET[s]) MARKET[s] = [s, 'stock', 0, 0]; });
  applyQuotes(r.quotes||{});
  P.pos.forEach(p=>{ if (!(prices[p.sym]>0)){ prices[p.sym] = p.b; prev[p.sym] = p.b; } });
  Object.keys(MARKET).forEach(s=>{ if (!(prices[s]>0)){ prices[s] = MARKET[s][2]||0; prev[s] = prices[s]; } });
  SPY_START = P.spyStart || SETTINGS.spyStart || prices.SPY;
  if (r.market) LIVE.status = Object.assign({}, LIVE.status||{}, {market:r.market});
  mmSettle();
  P.pos.filter(p=>MARKET[p.sym][1]==='bond').forEach(p=>loadYield(p.sym));
  goLive();
}
async function loadMe(quiet){
  try{
    const r = await call('me');
    ROLE = r.role; ME_INFO = r.me; BOOTED = true;
    if (canTrade()) applyState(r); else { P = EMPTY(); goLive(); }
    quiet ? repaint() : render();
    return true;
  }catch(e){
    if (e.status===401){ signedOut(); return false; }
    BOOTED = true; LOGIN.err = e.message; ROLE = null; render(); return false;
  }
}
let stLoading = false;
async function loadStandings(){
  if (stLoading || !ROLE) return;
  stLoading = true;
  try{ applyStandings(await call('standings')); repaint(); }catch(e){ /* keep the last standings */ }
  finally{ stLoading = false; }
}
async function boot(){
  render();
  if (!(await loadMe())) return;
  // Someone else is signed in on this device and a different person scanned their slip: switch to them.
  if (GO && !GO.done){
    const same = (GO.kind==='student' && ROLE==='student' && ME_INFO.id===GO.student) || (GO.kind==='teacher' && ROLE==='teacher' && ME_INFO.id===GO.teacher);
    if (!same){ await call('logout', {}).catch(()=>{}); signedOut(); return; }
    GO.done = true;
  }
  loadStandings(); refreshLive();
  if (ROLE==='teacher' || ROLE==='admin') loadClasses();
  if (ROLE==='admin') loadAdmin();
}

/* ---------- render ---------- */
const ROUTES = {student:['portfolio','standings','checkup','charts','trade'], teacher:['classes','portfolio','standings','charts','trade'], admin:['admin','classes','standings','charts']};
const NAVL = {portfolio:'My Portfolio', standings:'Standings', checkup:'Checkup', charts:'Charts', trade:'Trade', classes:'My Classes', admin:'Admin'};
const canTrade = () => ROLE==='student' || ROLE==='teacher';
const route = () => { const h = (location.hash||'').replace('#',''), ok = ROUTES[ROLE] || []; return ok.includes(h) ? h : (ok[0] || 'login'); };
function renderNav(){
  const r = route(), list = ROUTES[ROLE] || [];
  document.getElementById('nav').innerHTML = list.map(k=>`<a href="#${k}" data-route="${k}" aria-current="${k===r?'page':'false'}">${ROLE==='admin' && k==='classes' ? 'Classes' : NAVL[k]}</a>`).join('');
  document.getElementById('acct').innerHTML = ROLE ? `<span><b>${esc(ME_INFO.name)}</b>${ROLE==='student' ? ' · '+esc(ME_INFO.school) : ROLE==='teacher' ? ' · Teacher' : ''}</span><button type="button" data-act="signout">Sign out</button>` : '';
}
function renderBanner(){
  const b = document.getElementById('banner'); if (!b) return;
  const out = [];
  if (ROLE && SETTINGS.trading===false) out.push('<span class="w">Trading is paused right now.</span>');
  if (UI.err && !UI.sheet && !['trade','classes','admin'].includes(route())) out.push(`<span class="e" role="alert">${esc(UI.err)}</span><button type="button" data-act="clearerr">Dismiss</button>`);
  b.innerHTML = out.join('');
}
function render(){
  const r = route();
  renderNav(); renderBanner(); renderAttr();
  const app = document.getElementById('app'), signed = !!ROLE;
  document.getElementById('attr').hidden = !signed;
  document.querySelector('.tape').hidden = !signed;
  if (CH){ CH.chart.remove(); CH = null; }
  if (!signed){
    app.innerHTML = BOOTED ? vLogin() : '<div class="wrap"><p class="empty" style="padding-block:64px">Loading…</p></div>';
    document.getElementById('overlay').innerHTML = '';
    return;
  }
  app.innerHTML = r==='standings'?vStandings() : r==='portfolio'?vPortfolio() : r==='checkup'?vCheckup() : r==='charts'?vCharts()
    : r==='classes'?vClasses() : r==='admin'?vAdmin() : vTrade();
  if (r==='charts') mountChart();
  const dr = UI.drawer && UI.drawer.startsWith('tstudent:') ? `<div class="scrim" data-act="close"><div class="drawer" role="dialog" aria-modal="true" data-stop><button type="button" class="x" data-act="close" aria-label="Close">×</button>${vTeacherStudent(+UI.drawer.split(':')[1])}</div></div>` : vDrawer();
  document.getElementById('overlay').innerHTML = dr + vSheet() + vGuide() + vModal();
  renderTape(false);
  if (DONUT_ON) donutSet(DONUT_ON.key, DONUT_ON.i);
}
/* donut hover: slices and their list rows light each other up */
document.addEventListener('mouseover', e=>{ const t = e.target.closest && e.target.closest('[data-dk][data-di]'); if (t) donutSet(t.dataset.dk, t.dataset.di); });
document.addEventListener('mouseout', e=>{
  const t = e.target.closest && e.target.closest('[data-dk][data-di]'); if (!t || !DONUT_ON) return;
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-dk][data-di]');
  if (!to) donutSet(null);
});
document.addEventListener('click', e=>{
  const t = e.target.closest && e.target.closest('[data-dk][data-di]');
  if (t){ const same = DONUT_ON && DONUT_ON.key===t.dataset.dk && DONUT_ON.i===t.dataset.di; donutSet(same && e.pointerType!=='mouse' ? null : t.dataset.dk, t.dataset.di); }
  else if (DONUT_ON && !(e.target.closest && e.target.closest('.dnut'))) donutSet(null);
});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  if (el.tagName==='A' && el.getAttribute('href')){ UI.drawer=null; UI.sheet=null; return; }
  e.preventDefault(); act(el.dataset.act, el);
});
document.addEventListener('input', e=>{
  if (e.target.dataset && e.target.dataset.k && e.target.id.startsWith('num-')){
    const k = e.target.dataset.k, id = e.target.id, pos = e.target.selectionStart;
    UI.raw = UI.raw || {}; UI.raw[k] = e.target.value.replace(/[^0-9.,$]/g, '');
    setNum(k, UI.raw[k]);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    const i = document.getElementById(id); if (i){ i.focus(); try{ i.setSelectionRange(pos, pos); }catch(err){} }
    return;
  }
  if (e.target.id==='wsearch'){ UI.wq = e.target.value; const r = document.getElementById('wres'); if (r) r.innerHTML = wlResults(); return; } if (e.target.id==='search'){ UI.trade.q = e.target.value; document.getElementById('chips').innerHTML = chipsHtml(); } });
document.addEventListener('mouseover', e=>{ const tip = document.getElementById('ftip'), t = e.target.closest && e.target.closest('[data-tip]'); if (!tip || !t) return; tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false; });
document.addEventListener('mousemove', e=>{ const tip = document.getElementById('ftip'); if (!tip || tip.hidden) return; tip.style.left = Math.max(8, Math.min(e.clientX+16, window.innerWidth-tip.offsetWidth-8))+'px'; tip.style.top = Math.max(8, Math.min(e.clientY+16, window.innerHeight-tip.offsetHeight-8))+'px'; });
document.addEventListener('mouseout', e=>{ const tip = document.getElementById('ftip'), t = e.target.closest && e.target.closest('[data-tip]'); if (!tip || !t) return; const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]'); if (!to) tip.hidden = true; });
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && (UI.drawer||UI.sheet||UI.guide||UI.modal)){ UI.drawer=null; UI.sheet=null; UI.guide=false; UI.modal=null; render(); }
  if (e.key==='Enter' && e.target.matches && e.target.matches('tr[data-act]')) act(e.target.dataset.act, e.target);
});
document.addEventListener('submit', e=>{
  if (e.target.id==='lform'){ e.preventDefault(); signIn(); }
  if (e.target.id==='renameform'){
    e.preventDefault();
    const f = e.target, period = f.querySelector('#rperiod').value.trim();
    if (!period) return;
    f.setAttribute('aria-busy','true');
    call('teacher_act', {a:'rename_class', sectionId:+f.dataset.sec, period}).then(()=>{ UI.modal = null; loadClasses(); loadStandings(); render(); })
      .catch(err=>{ f.removeAttribute('aria-busy'); alert(err.message); });
  }
  if (e.target.id==='addform'){
    e.preventDefault();
    const f = e.target, first = f.querySelector('#afirst').value.trim(), last = f.querySelector('#alast').value.trim();
    if (!first || !last) return;
    f.setAttribute('aria-busy','true');
    call('teacher_act', {a:'add', sectionId:+f.dataset.sec, first, last}).then(r=>{
      UI.slips = r.slips; const s = r.slips[0].students[0];
      UI.modal = {title:'Student added', html:`<p style="margin:0;font-size:18px;color:var(--soft)">${esc(s.name)}’s password:</p><span class="pw">${esc(s.pw)}</span>
        <div class="btnrow"><button type="button" class="cta" data-act="print">Print slip</button><button type="button" class="ghost" data-act="close">Done</button></div>`};
      loadClasses(); loadStandings(); render();
    }).catch(err=>{ f.removeAttribute('aria-busy'); alert(err.message); });
  }
});
document.addEventListener('change', e=>{
  if (e.target.id==='afile' && e.target.files && e.target.files[0]){
    const rd = new FileReader();
    rd.onload = () => { UI.csv = String(rd.result||''); UI.preview = null; render(); };
    rd.readAsText(e.target.files[0]);
  }
});
window.addEventListener('hashchange', ()=>{ UI.back=null; UI.drawer=null; UI.sheet=null; UI.guide=false; UI.modal=null; UI.wq=''; UI.err=null; render(); window.scrollTo(0,0); });

/* redraw prices without interrupting someone who is typing or has a panel open */
function repaint(){
  renderAttr();
  if (route()==='charts' && !UI.sheet && !UI.drawer){ tickChart(); renderTape(true); return; }
  const ae = document.activeElement;
  if (UI.sheet || UI.modal || (UI.drawer && !UI.drawer.startsWith('tstudent:') && !UI.drawer.startsWith('student:')) || (ae && (ae.id==='search' || ae.id==='wsearch' || ae.tagName==='TEXTAREA' || (ae.tagName==='INPUT' && ae.type!=='button')))) { renderTape(true); return; }
  const y = window.scrollY; render(); window.scrollTo(0,y); renderTape(true);
}
/* Money market interest ticks up on screen; standings refresh every minute; the portfolio every 5 minutes
   (to pick up end-of-day payments and notes). Prices refresh every minute (see goLive). */
setInterval(()=>{ if (canTrade()){ mmSettle(); } }, 60000);
setInterval(()=>{ if (ROLE && document.visibilityState==='visible'){ loadStandings(); if (route()==='classes') loadClasses(); } }, 60000);
setInterval(()=>{ if (canTrade() && document.visibilityState==='visible' && !BUSY && !UI.sheet) loadMe(true); }, 300000);
boot();
})();
</script>

</body></html>
